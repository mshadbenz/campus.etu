.btn-s{border-color:#C9D9E2;background:#fff;color:var(--navy)}.btn-s:hover{border-color:var(--navy)}
.links a.btn{border-radius:10px}
.hero{padding:76px 0 100px;background:radial-gradient(900px 420px at 92% -12%,rgba(10,147,184,.16),transparent 70%),linear-gradient(180deg,#fff,#F7FBFD)}
.note{border-left:2px solid var(--gold);color:#4A6074}
.art{border-radius:22px;box-shadow:0 40px 70px -30px rgba(11,31,68,.5),0 0 0 1px rgba(200,164,92,.35)}
.float{border-radius:12px;font-weight:600;box-shadow:0 18px 36px -14px rgba(11,31,68,.35)}
.card{border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--sh);padding:30px}.card:hover{transform:translateY(-3px);border-color:rgba(200,164,92,.75);box-shadow:0 1px 2px rgba(11,31,68,.05),0 26px 48px -24px rgba(11,31,68,.38)}
.ic{background:var(--lblue);border:1px solid #D2E8F0;border-radius:12px;color:var(--navy)}
.alt{background:var(--bg)}.phero{padding:84px 0 56px;background:linear-gradient(180deg,#EAF5F9,#fff)}
.tag{background:var(--lblue);color:#0B6F8C;font-weight:600}
.dark,.joincard{background:radial-gradient(700px 320px at 100% 0,rgba(10,147,184,.28),transparent 70%),linear-gradient(135deg,var(--ink),#123273)}.joincard{border-radius:24px;box-shadow:0 34px 60px -30px rgba(11,31,68,.6),inset 0 0 0 1px rgba(200,164,92,.35)}
.dest{border-radius:var(--r);aspect-ratio:3/4.3;border:1px solid rgba(200,164,92,.4);padding:20px;background:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.6px) 0 0/22px 22px,linear-gradient(180deg,#17428F 0%,var(--ink) 100%);box-shadow:var(--sh)}
.dest:hover{transform:translateY(-5px);border-color:var(--gold)}.dest:after{background:linear-gradient(transparent 38%,rgba(5,14,36,.9))}
.dest .map{top:16px;width:58%;max-width:190px}.dest h3{font-size:1.3rem;margin:0 0 6px;font-weight:700}
.dest p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:.82rem;line-height:1.5;margin:0 0 10px}.dest span{font-weight:600;color:var(--gold)}
.step:before{background:var(--navy);box-shadow:0 0 0 4px #fff,0 0 0 5px var(--gold)}
details{border-radius:12px;box-shadow:var(--sh);padding:18px 22px}summary{font-weight:600}
.form{border-radius:22px;box-shadow:0 40px 70px -40px rgba(11,31,68,.4)}input,select,textarea{border-radius:10px;border-color:#CBDAE3;padding:14px 15px}input:focus,select:focus,textarea:focus{border-color:var(--navy);box-shadow:0 0 0 4px rgba(10,147,184,.14);outline:none}
footer{background:radial-gradient(600px 300px at 0 0,rgba(10,147,184,.18),transparent 70%),linear-gradient(170deg,var(--ink),#0F2A5E);border-top:2px solid var(--gold)}footer h3{font-weight:600}
.copy{border-color:rgba(255,255,255,.12)}

.news{padding:26px 0 0;background:#fff}.news+.hero{padding-top:44px}
.nws{position:relative;border-radius:22px;overflow:hidden;color:#fff;background:radial-gradient(520px 260px at 100% 0,rgba(10,147,184,.35),transparent 70%),linear-gradient(135deg,var(--ink),#123273);box-shadow:0 30px 60px -34px rgba(11,31,68,.6),inset 0 0 0 1px rgba(200,164,92,.35)}
.nws-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 44px 0}.nws-head h2{margin:0;color:#fff;font-size:1.15rem;letter-spacing:-.01em;font-weight:600}
.nws-ctl{display:flex;align-items:center;gap:12px}.nws-btn{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#fff;cursor:pointer;display:grid;place-items:center}.nws-btn:hover{background:rgba(255,255,255,.2)}
.nws-dots{display:flex;gap:7px;align-items:center}.nws-dot{width:8px;height:8px;border-radius:99px;border:0;padding:0;background:rgba(255,255,255,.35);cursor:pointer;transition:.25s}.nws-dot.on{width:24px;background:var(--gold)}
.nws-view{overflow:hidden}.nws-track{display:flex;transition:transform .65s cubic-bezier(.22,.8,.24,1)}
.nws-s{flex:0 0 100%;min-width:0;display:grid;grid-template-columns:1.15fr .85fr;gap:34px;align-items:center;padding:20px 44px 38px}
.nws-t{min-width:0}.nws-chip{display:inline-block;font-size:.8rem;font-weight:600;padding:4px 12px;border-radius:99px;border:1px solid rgba(200,164,92,.7);color:var(--gold);margin-bottom:14px}
.nws-s h3{color:#fff;font-size:clamp(1.4rem,2.6vw,2rem);line-height:1.15;letter-spacing:-.025em;margin:0 0 10px;font-weight:700}.nws-s p{color:#C9D7F0;margin:0 0 20px;max-width:52ch}
.nws-m{aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}.nws-m iframe{width:100%;height:100%;border:0;display:block}
.nws-i{height:100%;display:grid;place-items:center;font-size:4.4rem;background:radial-gradient(circle at 30% 20%,rgba(31,193,224,.35),transparent 60%)}
html[dir=rtl] .nws-btn svg{transform:scaleX(-1)}
.nws-v{position:relative;width:100%;height:100%;border:0;padding:0;cursor:pointer;background:#0B1F44 center/cover no-repeat;display:grid;place-items:center}.nws-v:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(5,14,36,.55))}.nws-v i{position:relative;z-index:1;width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff;display:grid;place-items:center;box-shadow:0 12px 28px rgba(0,0,0,.4)}
@media(max-width:760px){.nws-head{padding:16px 20px 0}.nws-s{grid-template-columns:1fr;padding:16px 20px 26px;gap:18px}.nws-s:not(.isv) .nws-m{display:none}.nws-s p{max-width:none}}

.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,280px));gap:30px;justify-content:start;margin-top:28px}.tm{margin:0;text-align:start}@media(max-width:620px){.team{grid-template-columns:repeat(2,1fr);gap:16px}.tm h3{font-size:1.05rem}.tm figcaption strong{font-size:.95rem}.tm figcaption span{font-size:.85rem}}
.tm img{width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;border-radius:18px;display:block;background:var(--bg);box-shadow:var(--sh);border:1px solid var(--line);transition:box-shadow .3s,border-color .3s}.tm:hover img{border-color:rgba(200,164,92,.75);box-shadow:0 26px 48px -24px rgba(11,31,68,.4)}
.tm h3{margin:18px 0 4px;font-size:1.3rem;font-weight:700}.tm figcaption{margin-top:16px;display:flex;flex-direction:column;gap:2px}.tm h3+figcaption{margin-top:0}.tm figcaption strong{color:var(--navy);font-size:1.08rem;font-weight:700}.tm figcaption span{color:var(--mute);font-size:.95rem}
.tm-ph{aspect-ratio:4/5;border-radius:18px;background:#fff;border:1px dashed #B9D2DE;display:grid;place-items:end center;overflow:hidden}.tm-ph svg{width:78%;height:auto;display:block}.tm img{background:#fff}
.team{display:block;margin-top:34px}.tm{display:grid;grid-template-columns:280px 1fr;gap:44px;align-items:center;padding:34px 0;border-top:1px solid var(--line);text-align:start}.tm:last-child{border-bottom:1px solid var(--line)}
.tm-p{width:100%}.tm-p img{width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;border-radius:18px;display:block;background:#fff;box-shadow:var(--sh);border:1px solid var(--line)}.tm-p .tm-ph{border-radius:18px}
.tm-b h3{margin:0 0 6px;font-size:clamp(1.5rem,2.6vw,2rem);letter-spacing:-.025em}.tm-r{margin:0 0 16px;display:flex;flex-direction:column;gap:2px}.tm-r strong{color:var(--gold-d);font-size:1.1rem;font-weight:700}.tm-r span{color:var(--mute)}
.tm-b .ticks{max-width:620px}.tm-b .ticks li{border-color:var(--line)}
@media(max-width:760px){.tm{grid-template-columns:1fr;gap:20px;padding:26px 0}.tm-p{max-width:240px}}
.tm-s{margin:0 0 14px;color:var(--text)}.tm-c{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:6px}.tm-c li{display:flex;gap:14px;align-items:baseline}.tm-c span{min-width:84px;color:var(--mute);font-size:.92rem}.tm-c a{font-weight:600;color:var(--navy)}.tm-c a:hover{color:var(--blue)}</style>
</head>

["h","4. Consent","4. Consentement","4. الموافقة"],
["p","We process your personal information on the basis of the consent you give when you submit our application form, including your consent for us to collect, store and process your information solely to evaluate your application and provide study-abroad services. You may withdraw your consent at any time by contacting us, although we may then be unable to continue providing some or all of our services.","Nous traitons vos informations personnelles sur la base du consentement que vous donnez en envoyant notre formulaire de candidature, notamment pour que nous les collections, conservions et traitions uniquement afin d'évaluer votre candidature et de fournir des services d'études à l'étranger. Vous pouvez retirer votre consentement à tout moment en nous contactant, mais nous pourrions alors ne plus pouvoir fournir tout ou partie de nos services.","نعالج معلوماتك الشخصية استنادًا إلى موافقتك عند إرسال استمارة التقديم، ومنها موافقتك على جمعها وحفظها ومعالجتها فقط لتقييم طلبك وتقديم خدمات الدراسة في الخارج. يمكنك سحب موافقتك في أي وقت بالتواصل معنا، وقد لا نتمكن حينها من مواصلة تقديم بعض خدماتنا أو كلها."],

["p","We take reasonable measures to protect your information against unauthorized access, loss or misuse. No method of transmission or storage is completely secure, so we cannot guarantee absolute security. We keep your information only for as long as needed to provide our services, meet our legal obligations and resolve disputes.","Nous prenons des mesures raisonnables pour protéger vos informations contre l'accès non autorisé, la perte ou l'utilisation abusive. Aucune méthode de transmission ou de stockage n'étant totalement sûre, nous ne pouvons garantir une sécurité absolue. Nous ne conservons vos informations que le temps nécessaire pour fournir nos services, respecter nos obligations légales et régler les litiges.","نتخذ إجراءات معقولة لحماية معلوماتك من الوصول غير المصرح به أو الفقدان أو سوء الاستخدام. ولأنه لا توجد طريقة نقل أو تخزين آمنة تمامًا، لا يمكننا ضمان أمان مطلق. نحتفظ بمعلوماتك فقط للمدة اللازمة لتقديم خدماتنا والوفاء بالتزاماتنا القانونية وحل النزاعات."],

["p","Campus Étudiant provides educational consultancy and administrative support services to help you pursue admission to an international higher education institution and, where applicable, to prepare the student visa process. Our services are consultancy and administrative support only.","Campus Étudiant fournit des services de conseil en éducation et d'appui administratif pour vous aider à obtenir une admission dans un établissement d'enseignement supérieur international et, le cas échéant, à préparer la procédure de visa étudiant. Nos services se limitent au conseil et à l'appui administratif.","تقدّم Campus Étudiant خدمات استشارية تعليمية ودعمًا إداريًا لمساعدتك على السعي للقبول في مؤسسة تعليم عالٍ دولية، وعند الاقتضاء تحضير إجراءات تأشيرة الدراسة. خدماتنا استشارية ودعم إداري فقط."],

["u",["Academic profile evaluation.","Évaluation du profil académique.","تقييم الملف الأكاديمي."],["University and programme selection.","Choix de l'université et du programme.","اختيار الجامعة والبرنامج."],["Admission eligibility assessment.","Évaluation de l'éligibilité à l'admission.","تقييم أهلية القبول."],["Preparation and review of application documents.","Préparation et relecture des documents de candidature.","تحضير ومراجعة وثائق التقديم."],["University application submission.","Dépôt des candidatures universitaires.","تقديم طلبات الجامعات."],["Follow-up with universities.","Suivi auprès des universités.","المتابعة مع الجامعات."],["Admission monitoring.","Suivi de l'admission.","متابعة القبول."],["Student visa application guidance.","Accompagnement pour la demande de visa étudiant.","التوجيه بشأن طلب تأشيرة الدراسة."],["Pre-departure guidance.","Accompagnement avant le départ.","التوجيه قبل السفر."]],

["u",["Provide complete, accurate and authentic documentation.","Fournir des documents complets, exacts et authentiques.","تقديم وثائق كاملة ودقيقة وأصلية."],["Immediately notify us of any changes affecting the application.","Nous informer immédiatement de tout changement affectant la candidature.","إبلاغنا فورًا بأي تغيير يؤثر على الطلب."],["Submit all requested documents before applicable deadlines.","Remettre tous les documents demandés avant les délais applicables.","تقديم جميع الوثائق المطلوبة قبل المواعيد المحددة."],["Pay all agreed service fees according to the payment schedule.","Payer tous les frais de service convenus selon l'échéancier de paiement.","دفع جميع رسوم الخدمة المتفق عليها وفق جدول الدفع."],["Review all submitted information before final submission.","Vérifier toutes les informations soumises avant l'envoi final.","مراجعة جميع المعلومات المقدمة قبل التقديم النهائي."],["Respond promptly to our requests.","Répondre rapidement à nos demandes.","الرد بسرعة على طلباتنا."]],
["p","You acknowledge that any inaccurate, incomplete or fraudulent information may result in rejection by universities or immigration authorities, for which Campus Étudiant bears no responsibility.","Vous reconnaissez que toute information inexacte, incomplète ou frauduleuse peut entraîner un refus de la part des universités ou des autorités d'immigration, dont Campus Étudiant n'est pas responsable.","تقرّ بأن أي معلومات غير دقيقة أو ناقصة أو مزوّرة قد تؤدي إلى الرفض من الجامعات أو سلطات الهجرة، ولا تتحمل Campus Étudiant مسؤولية ذلك."],
["h","5. Our responsibilities","5. Nos responsabilités","5. مسؤولياتنا"],
["u",["Perform our services with reasonable professional care and diligence.","Exécuter nos services avec un soin et une diligence professionnels raisonnables.","أداء خدماتنا بعناية مهنية وجهد معقولين."],["Maintain regular communication regarding the progress of your application.","Communiquer régulièrement sur l'avancement de votre candidature.","التواصل بانتظام بشأن تقدّم طلبك."],["Maintain the confidentiality of your personal information.","Préserver la confidentialité de vos informations personnelles.","الحفاظ على سرية معلوماتك الشخصية."],["Provide guidance based on current admission requirements available at the time of consultation.","Fournir des conseils fondés sur les conditions d'admission en vigueur au moment de la consultation.","تقديم توجيه مبني على شروط القبول المتاحة وقت الاستشارة."]],

["h","6. Professional disclaimer","6. Avertissement professionnel","6. إخلاء المسؤولية المهني"],
["p","All admission, scholarship, visa and immigration decisions are made solely by the relevant universities, governmental authorities, embassies and consulates. Accordingly, Campus Étudiant does not guarantee:","Toutes les décisions d'admission, de bourse, de visa et d'immigration sont prises exclusivement par les universités, autorités gouvernementales, ambassades et consulats concernés. En conséquence, Campus Étudiant ne garantit pas :","جميع قرارات القبول والمنح والتأشيرات والهجرة تتخذها حصريًا الجامعات والسلطات الحكومية والسفارات والقنصليات المعنية. وبناءً على ذلك لا تضمن Campus Étudiant ما يلي:"],
["u",["Admission to any university.","L'admission dans une université.","القبول في أي جامعة."],["Scholarship awards.","L'obtention de bourses.","الحصول على منح دراسية."],["Visa approval.","L'obtention du visa.","الموافقة على التأشيرة."],["Residence permit approval.","L'obtention d'un titre de séjour.","الموافقة على تصريح الإقامة."],["Immigration approval.","L'approbation en matière d'immigration.","الموافقة على الهجرة."],["Processing times.","Les délais de traitement.","مدد المعالجة."],["University response times.","Les délais de réponse des universités.","مدد رد الجامعات."]],
["p","Any opinions or recommendations we provide are professional advice only and must not be interpreted as guarantees.","Les avis ou recommandations que nous fournissons constituent uniquement des conseils professionnels et ne doivent pas être interprétés comme des garanties.","أي آراء أو توصيات نقدمها هي نصائح مهنية فقط ولا يجوز تفسيرها كضمانات."],
["h","7. Fees and payment","7. Frais et paiement","7. الرسوم والدفع"],
["p","The consultancy fee and the payment schedule are set out in your Service Agreement. We commence work only after receipt of the agreed initial payment, unless otherwise agreed in writing. Official university application fees, visa fees, insurance, translation, legalization, courier services, language tests and any other third-party expenses are not included unless expressly stated.","Les honoraires de conseil et l'échéancier de paiement figurent dans votre contrat de service. Nous ne commençons le travail qu'après réception du paiement initial convenu, sauf accord écrit contraire. Les frais officiels de candidature universitaire, les frais de visa, l'assurance, la traduction, la légalisation, les services de courrier, les tests de langue et toute autre dépense de tiers ne sont pas inclus, sauf mention expresse.","تحدَّد رسوم الاستشارة وجدول الدفع في اتفاقية الخدمة الخاصة بك. لا نبدأ العمل إلا بعد استلام الدفعة الأولى المتفق عليها ما لم يُتفق كتابةً على خلاف ذلك. ولا تشمل الرسوم الرسمية لطلبات الجامعات ورسوم التأشيرة والتأمين والترجمة والتصديق وخدمات البريد السريع واختبارات اللغة وأي مصاريف لأطراف ثالثة ما لم يُنص على ذلك صراحةً."],
["h","8. Refunds","8. Remboursements","8. الاسترداد"],

["h","10. Confidentiality","10. Confidentialité","10. السرية"],
["p","We treat all personal documents and information as confidential, as explained in our Privacy Policy. Client information is only disclosed where necessary for application processing or where required by applicable law.","Nous traitons tous les documents et informations personnels de manière confidentielle, comme expliqué dans notre politique de confidentialité. Les informations du client ne sont divulguées que si cela est nécessaire au traitement de la candidature ou si la loi applicable l'exige.","نتعامل مع جميع الوثائق والمعلومات الشخصية بسرية كما هو موضح في سياسة الخصوصية. ولا يُفصح عن معلومات العميل إلا عند الضرورة لمعالجة الطلب أو عندما يقتضي القانون المعمول به ذلك."],
["h","11. Termination","11. Résiliation","11. الإنهاء"],

["h","12. Website content","12. Contenu du site","12. محتوى الموقع"],
["p","Information on this website, including destinations, programs, fees, deadlines and visa information, is general guidance only and is not legal, immigration or official advice. Always verify current requirements with universities, embassies, consulates and official government sources.","Les informations de ce site, notamment sur les destinations, programmes, frais, délais et visas, sont des indications générales et ne constituent pas un avis juridique, d'immigration ou officiel. Vérifiez toujours les conditions en vigueur auprès des universités, ambassades, consulats et sources gouvernementales officielles.","المعلومات الواردة في هذا الموقع، ومنها الوجهات والبرامج والرسوم والمواعيد ومعلومات التأشيرة، إرشادات عامة فقط وليست استشارة قانونية أو رسمية أو متعلقة بالهجرة. تحقق دائمًا من الشروط الحالية لدى الجامعات والسفارات والقنصليات والمصادر الحكومية الرسمية."],
["h","13. Entire agreement and changes","13. Intégralité du contrat et modifications","13. كامل الاتفاق والتعديلات"],

["title","Your Trusted Partner for Studying Abroad","Votre partenaire de confiance pour étudier à l'étranger","شريكك الموثوق للدراسة في الخارج"],
["lead","At Campus Étudiant, we believe that the best guidance comes from people who understand the journey.","Chez Campus Étudiant, nous pensons que le meilleur accompagnement vient de personnes qui comprennent le parcours.","في Campus Étudiant نؤمن بأن أفضل توجيه يأتي من أشخاص يفهمون هذه الرحلة."],
["p1","We are a student-driven team committed to helping ambitious students explore international education opportunities and turn their academic goals into concrete plans. As students ourselves, we understand the questions, challenges, and uncertainties that come with choosing a university, preparing an application, and navigating unfamiliar administrative procedures.","Nous sommes une équipe portée par des étudiants, engagée à aider les étudiants ambitieux à explorer les opportunités d'études à l'international et à transformer leurs objectifs académiques en projets concrets. Étudiants nous-mêmes, nous comprenons les questions, les difficultés et les incertitudes liées au choix d'une université, à la préparation d'une candidature et aux démarches administratives inconnues.","نحن فريق يقوده طلاب، ملتزم بمساعدة الطلاب الطموحين على استكشاف فرص التعليم الدولي وتحويل أهدافهم الأكاديمية إلى خطط عملية. وبما أننا طلاب أيضًا، فإننا نفهم الأسئلة والتحديات وحالات عدم اليقين التي ترافق اختيار الجامعة وإعداد الطلب والتعامل مع إجراءات إدارية غير مألوفة."],
["p2","Our team combines firsthand student perspectives with practical knowledge of university admissions, pre-enrollment procedures, application documentation, and student visa preparation. This allows us to approach every application with empathy, a clear understanding of student needs, and a genuine commitment to providing useful guidance.","Notre équipe allie le regard direct d'étudiants à une connaissance pratique des admissions universitaires, des procédures de préinscription, des dossiers de candidature et de la préparation du visa étudiant. Cela nous permet d'aborder chaque candidature avec empathie, une bonne compréhension des besoins des étudiants et un réel engagement à fournir des conseils utiles.","يجمع فريقنا بين منظور الطلاب المباشر ومعرفة عملية بالقبول الجامعي وإجراءات التسجيل الأولي ووثائق التقديم وتحضير تأشيرة الدراسة. وهذا يتيح لنا التعامل مع كل طلب بتعاطف وفهم واضح لاحتياجات الطلاب والتزام حقيقي بتقديم توجيه مفيد."],
["p3","We know that studying abroad can feel overwhelming, especially when dealing with different educational systems, documentation requirements, deadlines, and procedures. That is why we aim to make the process clearer, more organized, and easier to navigate, offering personalized assistance adapted to each student's academic background and ambitions.","Nous savons qu'étudier à l'étranger peut sembler accablant, surtout face à des systèmes éducatifs, des exigences documentaires, des délais et des procédures différents. C'est pourquoi nous voulons rendre le processus plus clair, plus organisé et plus facile à suivre, avec une aide personnalisée adaptée au parcours académique et aux ambitions de chaque étudiant.","نعلم أن الدراسة في الخارج قد تبدو مرهقة، خصوصًا عند التعامل مع أنظمة تعليمية ومتطلبات وثائق ومواعيد وإجراءات مختلفة. ولهذا نسعى إلى جعل العملية أوضح وأكثر تنظيمًا وأسهل في المتابعة، مع مساعدة شخصية تناسب الخلفية الأكاديمية وطموحات كل طالب."],
["p4","At Campus Étudiant, you are not simply an applicant — you are a student with goals, potential, and a future worth investing in. We are here to share our knowledge, guide you through the process, and help you take informed steps toward your international education journey.","Chez Campus Étudiant, vous n'êtes pas simplement un candidat : vous êtes un étudiant avec des objectifs, du potentiel et un avenir qui mérite qu'on y investisse. Nous sommes là pour partager notre savoir, vous guider tout au long du processus et vous aider à faire des pas éclairés vers vos études à l'international.","في Campus Étudiant لست مجرد متقدم، بل أنت طالب لديه أهداف وإمكانات ومستقبل يستحق الاستثمار فيه. نحن هنا لنشاركك معرفتنا ونرشدك خلال العملية ونساعدك على اتخاذ خطوات مدروسة نحو رحلتك الدراسية الدولية."],
["mis","To simplify access to international education by providing students with clear information, practical guidance, and personalized support throughout the university admission and student visa preparation process.","Simplifier l'accès aux études à l'international en offrant aux étudiants des informations claires, un accompagnement pratique et un soutien personnalisé tout au long de l'admission universitaire et de la préparation du visa étudiant.","تبسيط الوصول إلى التعليم الدولي بتزويد الطلاب بمعلومات واضحة وتوجيه عملي ودعم شخصي طوال مراحل القبول الجامعي وتحضير تأشيرة الدراسة."],
["vis","To build a community where students help students succeed, making international education more accessible through shared experience, reliable guidance, and a genuine understanding of the student journey.","Construire une communauté où les étudiants aident les étudiants à réussir, en rendant les études à l'international plus accessibles grâce à l'expérience partagée, à un accompagnement fiable et à une vraie compréhension du parcours étudiant.","بناء مجتمع يساعد فيه الطلاب بعضهم بعضًا على النجاح، وجعل التعليم الدولي أكثر إتاحة من خلال الخبرة المشتركة والتوجيه الموثوق والفهم الحقيقي لرحلة الطالب."],
["dh","What Makes Us Different?","Ce qui nous distingue","ما الذي يميزنا؟"],
["d1","Student-to-Student Understanding","Une compréhension d'étudiant à étudiant","فهم من طالب إلى طالب"],
["d1d","We understand the challenges students face because we are part of the same academic world. We approach your questions with empathy and a practical, student-centered perspective.","Nous comprenons les difficultés des étudiants car nous faisons partie du même monde académique. Nous abordons vos questions avec empathie et une approche pratique centrée sur l'étudiant.","نفهم التحديات التي يواجهها الطلاب لأننا جزء من العالم الأكاديمي نفسه. نتعامل مع أسئلتك بتعاطف ومنظور عملي يضع الطالب أولًا."],
["d2","Guidance Based on Experience","Un accompagnement fondé sur l'expérience","توجيه مبني على الخبرة"],
["d2d","We share our knowledge of the application journey and help students better understand the requirements, procedures, and preparation involved in studying abroad.","Nous partageons notre connaissance du parcours de candidature et aidons les étudiants à mieux comprendre les exigences, les procédures et la préparation liées aux études à l'étranger.","نشارك معرفتنا برحلة التقديم ونساعد الطلاب على فهم المتطلبات والإجراءات والتحضيرات الخاصة بالدراسة في الخارج بشكل أفضل."],
["d3","Personalized Assistance","Une aide personnalisée","مساعدة شخصية"],
["d3d","Every student has a different background and different ambitions. We take the time to understand your profile and help you explore options that suit your goals.","Chaque étudiant a un parcours et des ambitions différents. Nous prenons le temps de comprendre votre profil et de vous aider à explorer les options adaptées à vos objectifs.","لكل طالب خلفية وطموحات مختلفة. نأخذ الوقت لفهم ملفك ونساعدك على استكشاف الخيارات التي تناسب أهدافك."],
["d4","A Team That Moves Forward With You","Une équipe qui avance avec vous","فريق يتقدم معك"],
["d4d","From exploring study destinations to preparing application documents, we aim to provide organized, responsive, and supportive guidance at every stage.","De la découverte des destinations d'études à la préparation des documents de candidature, nous voulons offrir un accompagnement organisé, réactif et bienveillant à chaque étape.","من استكشاف وجهات الدراسة إلى تحضير وثائق التقديم، نسعى إلى تقديم توجيه منظّم ومتجاوب وداعم في كل مرحلة."],
["dest","Our Destinations","Nos destinations","وجهاتنا"],
["destd","We help students explore educational opportunities across Europe and better understand the application procedures associated with each destination.","Nous aidons les étudiants à explorer les opportunités d'études en Europe et à mieux comprendre les procédures de candidature propres à chaque destination.","نساعد الطلاب على استكشاف الفرص التعليمية في أوروبا وفهم إجراءات التقديم الخاصة بكل وجهة بشكل أفضل."],
["tag","We understand your journey because we're students, too.","Nous comprenons votre parcours parce que nous sommes aussi des étudiants.","نفهم رحلتك لأننا طلاب أيضًا."],
["close","Campus Étudiant — Students helping students build an international future.","Campus Étudiant : des étudiants qui aident des étudiants à construire un avenir international.","Campus Étudiant — طلاب يساعدون طلابًا على بناء مستقبل دولي."]
];

const teamHTML=()=>`<section><div class="wrap">${head("Team","Meet the team")}<div class="team">${TEAM.map(m=>`<article class="tm"><div class="tm-p">${m.img?`<img src="${m.img}" alt="${m.name||m.role}" loading="lazy" width="400" height="500">`:`<div class="tm-ph" role="img" aria-label="${m.name||m.role}"><svg viewBox="0 0 100 125" aria-hidden="true"><circle cx="50" cy="46" r="19" fill="#C9DCE6"/><path d="M12 125c0-26 17-42 38-42s38 16 38 42z" fill="#C9DCE6"/></svg></div>`}</div><div class="tm-b">${m.name?`<h3>${m.name}</h3>`:""}<p class="tm-r"><strong>${m.role}</strong>${m.role2?`<span>${m.role2}</span>`:""}</p>${m.bio?`<p class="tm-s">${m.bio}</p>`:""}${(m.contacts&&m.contacts.length)?`<ul class="tm-c">${m.contacts.map(c=>`<li><span>${c[0]}</span><a href="${c[2]||"tel:"+c[1].replace(/[^+\d]/g,"")}" dir="ltr">${c[1]}</a></li>`).join("")}</ul>`:""}${(m.duties&&m.duties.length)?`<ul class="ticks">${m.duties.map(d=>`<li>${d}</li>`).join("")}</ul>`:""}</div></article>`).join("")}</div></div></section>`;
const inclOf=id=>{const k=PACKS.find(x=>x.id===id)||{};return{list:k.incl||INCL,special:k.special||""}};
const inclHTML=()=>`<section style="padding:56px 0 24px"><div class="wrap"><span class="eyebrow">Included in your package</span><h2>What’s included, by country</h2><p class="lead">Pick your destination to see what your package covers.</p><div class="bar inc-tabs" role="tablist" aria-label="Destination" style="margin-top:22px">${DEST.map((d,i)=>`<button type="button" class="chip ${i?"":"on"}" role="tab" aria-selected="${!i}" data-inc="${d.id}">${d.f} ${d.n}</button>`).join("")}</div>${DEST.map((d,i)=>{const o=inclOf(d.id);return `<div class="card inc-p" id="inc-${d.id}" role="tabpanel" ${i?"hidden":""} style="max-width:760px"><h3 style="font-size:1.35rem;margin:0 0 6px">${d.f} ${d.n}</h3><p style="color:var(--mute);margin:0 0 8px">Complete consultancy package</p><ul class="ticks">${o.list.map(x=>`<li>${x}</li>`).join("")}</ul>${o.special?`<div style="margin-top:16px;padding:11px 14px;border-radius:14px;background:linear-gradient(135deg,#FFF4DC,#FFE2A0);border:1px solid #F2C14E;color:#6B4400;font-weight:800;display:flex;gap:8px;align-items:center"><span aria-hidden="true">★</span><span>${o.special}</span></div>`:""}<div class="cta" style="margin:20px 0 0">${cta("See pricing","/pricing","btn-s")}${cta("Start Your Application","/apply?d="+d.id)}</div></div>`}).join("")}</div></section>`;

["Mission","Mission","الرسالة"],["To make international study procedures understandable and organized for every student we support.","Rendre les démarches d'études internationales compréhensibles et organisées pour chaque étudiant que nous accompagnons.","جعل إجراءات الدراسة الدولية مفهومة ومنظّمة لكل طالب نرافقه."],["Vision","Vision","الرؤية"],["A world where ambitious students can pursue education abroad with trustworthy guidance.","Un monde où les étudiants ambitieux peuvent étudier à l'étranger avec un accompagnement de confiance.","عالم يستطيع فيه الطلاب الطموحون متابعة دراستهم في الخارج بتوجيه موثوق."],["Destinations served","Destinations couvertes","الوجهات التي نخدمها"],

["Who we are, where we can send you, and how we support you from your first idea to your departure.","Qui nous sommes, où nous pouvons vous envoyer et comment nous vous accompagnons de votre première idée jusqu'à votre départ.","من نحن، وإلى أين يمكننا إرسالك، وكيف نرافقك من فكرتك الأولى حتى سفرك."],
["Dreaming of studying abroad? You are not alone, and you do not have to work it out alone either.","Vous rêvez d'étudier à l'étranger ? Vous n'êtes pas seul(e), et vous n'avez pas à tout organiser seul(e).","هل تحلم بالدراسة في الخارج؟ لست وحدك، ولا يجب أن تتدبّر الأمر وحدك."],
["Campus Étudiant is a study-abroad guidance team for students who want to continue their studies in Italy, Spain, France, Poland or Portugal. We stay by your side through the whole journey: choosing the right program, preparing your application, and getting ready to leave.","Campus Étudiant est une équipe d'accompagnement pour les étudiants qui souhaitent poursuivre leurs études en Italie, en Espagne, en France, en Pologne ou au Portugal. Nous restons à vos côtés tout au long du parcours : choisir le bon programme, préparer votre candidature et vous préparer au départ.","Campus Étudiant فريق توجيه للطلاب الراغبين في متابعة دراستهم في إيطاليا أو إسبانيا أو فرنسا أو بولندا أو البرتغال. نبقى إلى جانبك طوال الرحلة: اختيار البرنامج المناسب، وتحضير طلبك، والاستعداد للسفر."],
["Who we help","Qui nous accompagnons","من نساعد"],["We work with students finishing high school, a bachelor's or a master's degree who want to apply to a university in Europe. Whether you already know your destination or you are still comparing options, we start from your profile, your goals and your budget.","Nous travaillons avec des étudiants qui terminent le lycée, une licence ou un master et souhaitent candidater dans une université européenne. Que vous connaissiez déjà votre destination ou que vous compariez encore les options, nous partons de votre profil, de vos objectifs et de votre budget.","نعمل مع طلاب ينهون الثانوية أو الإجازة أو الماستر ويرغبون في التقديم إلى جامعة أوروبية. سواء كنت تعرف وجهتك أم ما زلت تقارن الخيارات، ننطلق من ملفك وأهدافك وميزانيتك."],

["How we support you","Comment nous vous accompagnons","كيف نرافقك"],["Academic orientation to clarify your goals and options","Orientation académique pour clarifier vos objectifs et vos options","توجيه أكاديمي لتوضيح أهدافك وخياراتك"],["University and program selection that fits your background and budget","Choix d'université et de programme adaptés à votre parcours et à votre budget","اختيار جامعة وبرنامج يناسبان مسارك وميزانيتك"],["Application and admissions assistance, with a clear checklist and timeline","Aide à la candidature et à l'admission, avec liste de contrôle et calendrier clairs","مساعدة في التقديم والقبول مع قائمة مهام وجدول زمني واضحين"],["Motivation letter and CV preparation","Préparation de la lettre de motivation et du CV","تحضير رسالة الدافع والسيرة الذاتية"],["Student visa guidance and document organization","Accompagnement visa étudiant et organisation des documents","توجيه بشأن تأشيرة الدراسة وتنظيم الوثائق"],["Campus France procedures for France","Procédures Campus France pour la France","إجراءات Campus France لفرنسا"],["Interview preparation","Préparation à l'entretien","التحضير للمقابلة"],["Pre-enrollment and administrative help before you leave","Aide à la préinscription et aux démarches administratives avant le départ","مساعدة في التسجيل الأولي والإجراءات الإدارية قبل السفر"],["IELTS preparation resources to work on your English level","Ressources de préparation à l'IELTS pour améliorer votre anglais","موارد تحضير IELTS لتحسين مستواك في الإنجليزية"],
["How it works","Comment ça marche","كيف نعمل"],["Tell us your goal and share your background","Dites-nous votre objectif et présentez votre parcours","أخبرنا بهدفك وشاركنا مسارك"],["Build your strategy: destinations, programs and timeline","Construisez votre stratégie : destinations, programmes et calendrier","ابنِ استراتيجيتك: الوجهات والبرامج والجدول الزمني"],["Prepare your application and documents","Préparez votre candidature et vos documents","حضّر طلبك ووثائقك"],["Submit and follow your applications until admission","Déposez et suivez vos candidatures jusqu'à l'admission","قدّم طلباتك وتابعها حتى القبول"],["Prepare for departure: visa documents and pre-enrollment steps","Préparez le départ : documents de visa et préinscription","استعد للسفر: وثائق التأشيرة وخطوات التسجيل الأولي"],
["What you can expect from us","Ce que vous pouvez attendre de nous","ما يمكنك توقعه منا"],["Honest guidance. Universities decide on admissions and the authorities decide on visas, so nobody can promise you a result, and we will never do so. What we can do is give you clear information, a well-organized file and a team that answers your questions at every step.","Un accompagnement honnête. Les universités décident des admissions et les autorités des visas : personne ne peut vous promettre un résultat, et nous ne le ferons jamais. Nous pouvons en revanche vous offrir des informations claires, un dossier bien organisé et une équipe qui répond à vos questions à chaque étape.","توجيه صادق. الجامعات تقرر القبول والسلطات تقرر التأشيرات، لذلك لا أحد يستطيع أن يعدك بنتيجة، ونحن لن نفعل ذلك أبدًا. ما نستطيع تقديمه هو معلومات واضحة وملف منظّم وفريق يجيب عن أسئلتك في كل خطوة."],
["Ready to start?","Prêt(e) à commencer ?","هل أنت مستعد للبدء؟"],["Fill in the application form, or write to us on WhatsApp or at campus.etu@gmail.com. Our team will review your file and get back to you as soon as possible to explain the next steps.","Remplissez le formulaire de candidature ou écrivez-nous sur WhatsApp ou à campus.etu@gmail.com. Notre équipe étudiera votre dossier et vous répondra dès que possible pour vous expliquer les prochaines étapes.","املأ استمارة التقديم أو راسلنا عبر واتساب أو على campus.etu@gmail.com. سيراجع فريقنا ملفك ويتواصل معك في أقرب وقت لشرح الخطوات التالية."],["Contact Us","Nous contacter","تواصل معنا"],
["Let's talk about your plans","Parlons de vos projets","لنتحدث عن خططك"],["Send us a message and tell us how we can help.","Envoyez-nous un message et dites-nous comment nous pouvons vous aider.","أرسل لنا رسالة وأخبرنا كيف يمكننا مساعدتك."],["Reach us directly","Contactez-nous directement","تواصل معنا مباشرة"],["WhatsApp","WhatsApp","واتساب"],["Send a message","Envoyer un message","أرسل رسالة"],["Full name","Nom complet","الاسم الكامل"],["Email","E-mail","البريد الإلكتروني"],["Message","Message","الرسالة"],["Send Message","Envoyer le message","إرسال الرسالة"],["I agree to be contacted about my request. See the","J'accepte d'être contacté(e) au sujet de ma demande. Consultez la","أوافق على التواصل معي بخصوص طلبي. اطّلع على"],["privacy policy","politique de confidentialité","سياسة الخصوصية"],
["Legal","Mentions légales","قانوني"],["Privacy Policy & Terms","Politique de confidentialité et conditions","سياسة الخصوصية والشروط"],["Template placeholder — have a qualified professional provide the final privacy policy and terms of service before launch.","Texte provisoire : faites rédiger la politique de confidentialité et les conditions d'utilisation définitives par un professionnel qualifié avant le lancement.","نص مؤقت: يجب أن يعدّ مختص مؤهل سياسة الخصوصية وشروط الخدمة النهائية قبل الإطلاق."],["Information you submit through the forms is used only to respond to your request and to prepare your guidance. Do not submit information you are not comfortable sharing. Contact us to request access to or deletion of your data.","Les informations envoyées via les formulaires servent uniquement à répondre à votre demande et à préparer votre accompagnement. N'envoyez pas d'informations que vous ne souhaitez pas partager. Contactez-nous pour demander l'accès à vos données ou leur suppression.","تُستخدم المعلومات التي ترسلها عبر النماذج فقط للرد على طلبك وتحضير توجيهك. لا ترسل معلومات لا ترتاح لمشاركتها. تواصل معنا لطلب الاطلاع على بياناتك أو حذفها."],
["Refund Policy","Politique de remboursement","سياسة الاسترداد"],["How refunds work for Campus Étudiant services.","Comment fonctionnent les remboursements pour les services de Campus Étudiant.","كيف تعمل عمليات الاسترداد لخدمات Campus Étudiant."],["Draft policy — please review and complete the exact conditions (deadlines, percentages, payment methods) with a qualified professional before launch.","Politique provisoire : faites vérifier et compléter les conditions exactes (délais, pourcentages, moyens de paiement) par un professionnel qualifié avant le lancement.","سياسة مبدئية: يرجى مراجعة الشروط الدقيقة (المواعيد والنسب وطرق الدفع) واستكمالها مع مختص مؤهل قبل الإطلاق."],["Our services","Nos services","خدماتنا"],["Campus Étudiant provides guidance and support services for admissions, applications, student visa preparation and related procedures. Each service is explained to you before you start.","Campus Étudiant propose des services d'accompagnement pour les admissions, les candidatures, la préparation du visa étudiant et les démarches associées. Chaque service vous est expliqué avant le début.","تقدّم Campus Étudiant خدمات توجيه ودعم للقبول والتقديم وتحضير تأشيرة الدراسة والإجراءات المرتبطة بها. يُشرح لك كل نوع من الخدمات قبل البدء."],["Refund requests","Demandes de remboursement","طلبات الاسترداد"],["To request a refund, contact us in writing by email at campus.etu@gmail.com or on WhatsApp, with your full name and the service concerned. We review every request individually and reply as soon as possible.","Pour demander un remboursement, écrivez-nous par e-mail à campus.etu@gmail.com ou sur WhatsApp en indiquant votre nom complet et le service concerné. Nous étudions chaque demande individuellement et répondons dès que possible.","لطلب الاسترداد، راسلنا كتابيًا عبر البريد campus.etu@gmail.com أو واتساب مع ذكر اسمك الكامل والخدمة المعنية. ندرس كل طلب على حدة ونرد في أقرب وقت."],["When a refund may be considered","Quand un remboursement peut être envisagé","متى يمكن النظر في الاسترداد"],["You paid for a service that has not yet started.","Vous avez payé un service qui n'a pas encore commencé.","دفعتَ ثمن خدمة لم تبدأ بعد."],["A service could not be delivered by Campus Étudiant for reasons within our control.","Campus Étudiant n'a pas pu fournir un service pour des raisons qui dépendent de nous.","تعذّر على Campus Étudiant تقديم خدمة لأسباب تعود إلينا."],["A payment was made in error or charged twice.","Un paiement a été effectué par erreur ou prélevé deux fois.","تم دفع مبلغ بالخطأ أو خصمه مرتين."],["What is not refundable","Ce qui n'est pas remboursable","ما لا يمكن استرداده"],["Services already delivered or in progress, in proportion to the work completed.","Les services déjà fournis ou en cours, proportionnellement au travail effectué.","الخدمات التي قُدّمت أو قيد التنفيذ، بما يتناسب مع العمل المنجز."],["Fees paid to third parties, such as universities, application platforms, Campus France, embassies, consulates, translators or test centers.","Les frais versés à des tiers : universités, plateformes de candidature, Campus France, ambassades, consulats, traducteurs ou centres d'examen.","الرسوم المدفوعة لأطراف ثالثة مثل الجامعات ومنصات التقديم وCampus France والسفارات والقنصليات والمترجمين ومراكز الاختبار."],["Refusal of admission or of a visa. Decisions are taken by universities and authorities, and we cannot guarantee any outcome.","Le refus d'une admission ou d'un visa. Les décisions sont prises par les universités et les autorités, et nous ne pouvons garantir aucun résultat.","رفض القبول أو التأشيرة. القرارات تتخذها الجامعات والسلطات ولا يمكننا ضمان أي نتيجة."],["Delays or failure caused by incomplete, late or inaccurate information or documents provided by the student.","Les retards ou échecs dus à des informations ou documents incomplets, tardifs ou inexacts fournis par l'étudiant.","التأخير أو الإخفاق الناتج عن معلومات أو وثائق ناقصة أو متأخرة أو غير دقيقة قدّمها الطالب."],["How refunds are paid","Comment les remboursements sont effectués","كيف يتم دفع المبالغ المستردة"],["Approved refunds are returned using the same payment method whenever possible, within a reasonable time after approval.","Les remboursements approuvés sont effectués par le même moyen de paiement lorsque c'est possible, dans un délai raisonnable après approbation.","تُعاد المبالغ المعتمدة بنفس طريقة الدفع كلما أمكن، خلال مدة معقولة بعد الموافقة."],["Questions","Questions","أسئلة"],["If you have any questions about this policy, please contact us before making a payment.","Pour toute question sur cette politique, contactez-nous avant d'effectuer un paiement.","إذا كانت لديك أسئلة حول هذه السياسة، يرجى التواصل معنا قبل إجراء أي دفعة."],["Campus Étudiant. All rights reserved.","Campus Étudiant. Tous droits réservés.","Campus Étudiant. جميع الحقوق محفوظة."],

cations","Candidatures universitaires","طلبات التسجيل في الجامعات"],["Universitaly pre-enrollment","Pré-inscription Universitaly","التسجيل المسبق في Universitaly"],["Regional DSU Scholarship application","Demande de bourse DSU régionale","طلب المنحة الإقليمية DSU"],["Visa guidance","Accompagnement pour le visa étudiant","التوجيه بشأن تأشيرة الدراسة"],["30 € application fees offered by us","Frais de candidature de 30 € offerts par nous","رسوم التقديم البالغة 30 يورو مقدَّمة منا"],["Accommodation search","Recherche de logement","البحث عن سكن"],["Document translation","Traduction de documents","ترجمة الوثائق"],["Help finding student housing near your university.","Aide pour trouver un logement étudiant près de votre université.","مساعدة في العثور على سكن طلابي قريب من جامعتك."],["Certified translation of your academic documents into the language required by your destination country.","Traduction certifiée de vos documents académiques dans la langue exigée par votre pays de destination.","ترجمة معتمدة لوثائقك الأكاديمية إلى اللغة المطلوبة في بلد وجهتك."],["Other services are available on request. Contact us for the price.","D'autres services sont disponibles sur demande. Contactez-nous pour le tarif.","تتوفر خدمات أخرى عند الطلب. تواصل معنا لمعرفة السعر."],

["Payments for services already rendered are non-refundable. If we expressly guarantee a service in your Service Agreement and do not deliver it, you will be refunded for that service. Please read our Refund Policy for the details.","Les paiements pour des services déjà fournis ne sont pas remboursables. Si nous garantissons expressément un service dans votre contrat de service et ne le fournissons pas, ce service vous sera remboursé. Consultez notre politique de remboursement pour les détails.","المبالغ المدفوعة مقابل خدمات قُدّمت بالفعل غير قابلة للاسترداد. وإذا ضمنّا صراحةً خدمة في اتفاقية الخدمة ولم نقدّمها، فسيُردّ إليك مبلغ تلك الخدمة. يرجى قراءة سياسة الاسترداد لمعرفة التفاصيل."],
["Universities and authorities make the final decisions, so we cannot guarantee admission or a visa. We can, however, assess your profile and confirm whether you are eligible.","Les universités et les autorités prennent les décisions finales : nous ne pouvons donc garantir ni l'admission ni le visa. En revanche, nous pouvons analyser votre profil et vous confirmer si vous êtes éligible.","تتخذ الجامعات والسلطات القرارات النهائية، لذلك لا يمكننا ضمان القبول أو التأشيرة. لكن يمكننا تقييم ملفك وتأكيد ما إذا كنت مؤهلًا."],

function trs(core,l){const v=TRM.get(core);if(v)return v[l];for(const[re,fn]of PAT){const m=core.match(re);if(m){const r=fn(m,l);if(r!=null)return r}}return null}
function tr(str){if(LANG==="en")return str;const lead=str.match(/^\s*/)[0],trail=str.match(/\s*$/)[0];let core=str.trim();if(!core)return str;let star="";if(/ \*$/.test(core)){star=" *";core=core.slice(0,-2)}
 const l=LANG;let r=trs(core,l);
 if(r==null){const m=core.match(/^([^\p{L}\p{N}]+)(.+)$/su);if(m){const x=trs(m[2],l);if(x!=null)r=m[1]+x}}
 if(r==null&&core.includes(" · ")){r=core.split(" · ").map(p=>{const m=p.match(/^([^\p{L}\p{N}]*)(.+)$/su),x=m&&trs(m[2],l);return x!=null?m[1]+x:p}).join(" · ")}
 return r==null?str:lead+r+star+trail}

function pkgPrice(s){if(typeof PACKS==="undefined"||typeof DEST==="undefined")return null;const d=DEST.find(x=>x.n===s.country);if(!d)return null;const k=PACKS.find(x=>x.id===d.id);if(!k||!k.tiers||!k.tiers.length)return null;let t=k.tiers[0];if(k.tiers.length>1){const m=/master/i.test(s.level||"");t=k.tiers.find(x=>m===/master/i.test(x[0]||""))||k.tiers[0]}const n=parseInt(String(t[1]).replace(/[^\d]/g,""),10);return n||null}
function payAmt(s,i){const p=pkgPrice(s);if(!p)return"To be confirmed";const h=Math.ceil(p/2);return fmt(i===0?h:p-h)}
function payState(d,key){const rc=(d.payRc||{})[key],rv=(d.payRev||{})[key];
 const R_=r=>r&&r.fid?{fid:r.fid,n:r.n,type:r.type}:null;
 if(rv&&rv.pst==="paid")return{pst:"paid",rc:rc?rc.rc||"":"",ref:R_(rc)};
 if(rc&&rc.sent&&(!rv||rc.at>rv.at))return{pst:"review",rc:rc.rc||"",ref:R_(rc)};
 if(rv&&rv.pst==="rejected"){const ok=rc&&rc.at>rv.at;return{pst:"rejected",rc:ok?rc.rc||"":"",ref:ok?R_(rc):null}}
 return{pst:"due",rc:rc?rc.rc||"":"",ref:R_(rc)}}
function deriveEff(d){const e={docs:{},pay:{},ord:{}},up=d.docsUp||{},rv=d.docsRev||{},oq=d.ordReq||{},ov=d.ordRev||{};
 KEYS.forEach(k=>{const u=up[k],r=rv[k];e.docs[k]=u&&(!r||u.at>r.at)?"uploaded":r?r.s:"missing"});
 [0,1].forEach(i=>e.pay["p|"+i]=payState(d,"p|"+i));
 Object.keys(oq).forEach(t=>{e.ord[t]=ov[t]?ov[t].s:"Requested";e.pay["o|"+t]=payState(d,"o|"+t)});return e}
function fromDoc(id,d){const fb=(d.email||"").split("@")[0]||"Student";
 const s={id:0,fid:id,uid:d.uid||"",name:d.name||fb,_fb:fb,email:d.email||"",phone:d.phone||"",country:d.country||"",level:d.level||"",program:d.program||"",city:d.city||"",photo:d.photo||"",stage:+d.stage||0,stageDone:!!d.stageDone,agr:!!d.agr,apps:(d.apps||[]).map(x=>({...x})),hist:(d.hist||[]).map(x=>({...x})),notes:(d.notes||[]).map(x=>({...x})),delReq:!!d.delReq,msgs:[],nS:d.nS||[],nA:d.nA||[],pn:[],_raw:d};
 const e=s._eff=deriveEff(d),up=d.docsUp||{},oq=d.ordReq||{};
 s.docs=KEYS.map(k=>({k,n:"",h:"",s:e.docs[k],f:up[k]?up[k].f||"":"",ref:up[k]&&up[k].fid?{fid:up[k].fid,n:up[k].n,type:up[k].type}:null}));
 s.pay=PAYL.map((l,i)=>{const p=e.pay["p|"+i];return{l,a:payAmt(s,i),s:p.pst,pst:p.pst,rc:p.rc,ref:p.ref,rcUrl:""}});
 s.ord=Object.keys(oq).sort((a,b)=>oq[a].at-oq[b].at).map(t=>{const p=e.pay["o|"+t];return{t,s:e.ord[t],pst:p.pst,rc:p.rc,ref:p.ref,rcUrl:""}});
 return s}
const newDoc=u=>({name:u.displayName||"",email:u.email||"",phone:"",country:"",level:"",program:"",city:"",photo:"",uid:"",stage:0,stageDone:false,agr:false,apps:[],hist:[],notes:[],docsUp:{},payRc:{},ordReq:{},delReq:false,nA:[],createdAt:Date.now()});

function emptyStudent(){const s=fromDoc(null,{name:"No students yet",email:""});s.fid=null;s.uid="";return s}
function storeFor(s,role){const raw=s._raw,out={},now=Date.now();
 STU_P.forEach(k=>out[k]=s[k]==null?"":s[k]);if(s.name===s._fb&&!raw.name)out.name="";
 if(role==="student"){
  const up={...(raw.docsUp||{})};s.docs.forEach(d=>{if(d.s==="uploaded"){const u=up[d.k];if(!u||s._eff.docs[d.k]!=="uploaded")up[d.k]={f:d.f||"",at:now,...(d.ref||{})};else if(u.f!==(d.f||"")||(d.ref&&u.fid!==d.ref.fid))up[d.k]={...u,f:d.f||"",...(d.ref||{})}}});out.docsUp=up;
  const rc={...(raw.payRc||{})};pitems(s).forEach(i=>{const o=i.o,e=s._eff.pay[i.k]||{pst:"due",rc:""};if(o.pst==="paid")return;if(o.pst!==e.pst||(o.rc||"")!==(e.rc||"")||((o.ref&&o.ref.fid)||"")!==((e.ref&&e.ref.fid)||""))rc[i.k]={rc:o.rc||"",sent:o.pst==="review",at:now,...(o.ref||{})}});out.payRc=rc;
  const rq={...(raw.ordReq||{})};s.ord.forEach(o=>{if(!rq[o.t])rq[o.t]={at:now}});out.ordReq=rq;
  out.delReq=!!s.delReq
 }else{
  ADM_P.forEach(k=>out[k]=s[k]);
  const dv={...(raw.docsRev||{})};s.docs.forEach(d=>{if((d.s==="approved"||d.s==="rejected")&&s._eff.docs[d.k]!==d.s)dv[d.k]={s:d.s,at:now}});out.docsRev=dv;
  const pv={...(raw.payRev||{})};pitems(s).forEach(i=>{const o=i.o,e=s._eff.pay[i.k]||{pst:"due"};if((o.pst==="paid"||o.pst==="rejected")&&o.pst!==e.pst)pv[i.k]={pst:o.pst,at:now}});out.payRev=pv;
  const ov={...(raw.ordRev||{})};s.ord.forEach(o=>{if(o.s!=="Requested"&&s._eff.ord[o.t]!==o.s)ov[o.t]={s:o.s,at:now}});out.ordRev=ov
 }
 return out}
function persist(){if(!AUTH||!UID||!window.firebase&&!window.__FSMOCK)return;const role=st.role,T=role==="student"?[S[0]]:S;
 T.forEach(s=>{if(!s||!s.fid)return;
  const out=storeFor(s,role),upd={};Object.keys(out).forEach(k=>{const b=s._raw[k]===undefined?DEF[k]:s._raw[k];if(JSON.stringify(out[k])!==JSON.stringify(b))upd[k]=out[k]});
  const pn=s.pn||[];s.pn=[];const pm=(s.msgs||[]).filter(m=>!m.id&&!m.sent);pm.forEach(m=>{m.sent=true;m.at=Date.now()});
  if(!Object.keys(upd).length&&!pn.length&&!pm.length)return;
  const raw2={...s._raw,...upd};pn.forEach(([k,it])=>{raw2[k]=[...(raw2[k]||[]),it]});s._raw=raw2;s._eff=deriveEff(raw2);
  const fid=s.fid,items={};pn.forEach(([k,it])=>(items[k]=items[k]||[]).push(it));
  PQ=PQ.then(async()=>{const db=await getDB(),FV=FVal(),u={...upd};Object.keys(items).forEach(k=>u[k]=FV.arrayUnion(...items[k]));
   if(Object.keys(u).length)await db.doc("students/"+fid).update(u);
   for(const m of pm)await db.collection("students/"+fid+"/msgs").add({f:m.f,t:m.t,at:m.at})
  }).catch(e=>{console.error(e);toast("Could not save your last change. Check your connection and try again.")})
 })}
function softRender(){if(!R||!R.isConnected)return;const a=document.activeElement;if(a&&R.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.type!=="search"){PENDR=true;return}render()}
document.addEventListener("focusout",()=>{if(PENDR)setTimeout(()=>{const a=document.activeElement;if(PENDR&&!(a&&R&&R.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))){PENDR=false;R&&R.isConnected&&render()}},120)});

function failLive(host,e){console.error(e);const perm=e&&e.code==="permission-denied";host.innerHTML=`<div style="max-width:520px;margin:80px auto;padding:0 20px;text-align:center;color:#12264A"><h2>We couldn’t open your dashboard</h2><p style="color:#52697C">${perm?"Access was refused. If you are on the team, confirm your email address first (check your inbox for the Firebase message), then log in again. Otherwise, please contact the team.":"Please check your connection and try again."}</p><button class="btn p" id="flo" type="button" style="margin-top:10px">Log out</button></div>`;const b=host.querySelector("#flo");b&&b.addEventListener("click",doLogout)}

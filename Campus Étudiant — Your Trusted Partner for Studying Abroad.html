<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campus Étudiant — Your Trusted Partner for Studying Abroad</title>
<meta name="description" content="Campus Étudiant guides students through university admissions, student visa procedures and study-abroad applications in France, Italy, Spain, Poland and Portugal.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Cairo:wght@400;600;700;800&display=swap">
<style>
:root{--navy:#102A5C;--blue:#0A93B8;--teal:#1FC1E0;--lblue:#E0F6FC;--bg:#F1FAFD;--text:#12264A;--mute:#52697C;--line:#D3E8F0;--r:18px;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:90px}*,*:before,*:after{box-sizing:inherit}
body{margin:0;font:16px/1.65 'Plus Jakarta Sans',system-ui,'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;color:var(--text);background:#fff;overflow-x:hidden}
img,svg{max-width:100%}a{color:inherit;text-decoration:none}h1,h2,h3{line-height:1.12;margin:0 0 .5em;letter-spacing:-.02em;color:var(--navy)}
h1{font-size:clamp(2.3rem,6vw,4.2rem);font-weight:800}h2{font-size:clamp(1.7rem,3.6vw,2.6rem);font-weight:800}h3{font-size:1.15rem}p{margin:0 0 1em}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:6px}
.wrap{max-width:1180px;margin:auto;padding:0 22px}section{padding:84px 0}.alt{background:var(--bg)}.dark{background:linear-gradient(135deg,var(--navy),#1B4A94);color:#fff}.dark h2,.dark h3{color:#fff}.dark p{color:#C3D3EE}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);margin-bottom:12px;display:block}.lead{font-size:1.15rem;color:var(--mute);max-width:640px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 26px;border-radius:999px;font-weight:700;border:1.5px solid transparent;cursor:pointer;font:inherit;font-weight:700;transition:transform .15s,box-shadow .15s,background .15s}
.btn:hover{transform:translateY(-2px)}.btn-p{background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff;box-shadow:0 8px 22px rgba(10,147,184,.28)}.btn-s{background:#fff;border-color:var(--line);color:var(--navy)}.btn-w{background:#fff;color:var(--navy)}.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}
.btn-r{background:#D62828;color:#fff;box-shadow:0 8px 22px rgba(214,40,40,.28)}.btn-r:hover{background:#B91F1F}
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.7);backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:.25s}header.sc{background:#fff;border-color:var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:72px}.logo{font-weight:800;font-size:1.25rem;color:var(--navy);display:flex;gap:10px;align-items:center}.logo img{height:46px;width:auto;display:block}.logo i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--teal));display:grid;place-items:center;color:#fff;font-style:normal;font-size:1rem}
.links{display:flex;gap:16px;align-items:center}.links a{font-weight:500;font-size:.9rem;color:var(--mute);white-space:nowrap}header .wrap{max-width:1360px}.links a:hover,.links a.on{color:var(--navy)}.links a.btn{color:#fff;padding:9px 16px;font-size:.88rem}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:10px;width:44px;height:44px;font-size:1.3rem;cursor:pointer}
@media(max-width:1280px){.burger{display:block}.links{display:none;position:absolute;top:72px;left:0;right:0;background:#fff;flex-direction:column;align-items:stretch;padding:18px 22px 26px;border-bottom:1px solid var(--line);gap:4px}.links.open{display:flex}.links a{padding:12px 0}.links a.btn{justify-content:center;margin-top:6px}}
.hero{padding:60px 0 80px;background:radial-gradient(900px 400px at 85% 0,#BDEBF7,transparent),#fff}.hero .g{display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center}
@media(max-width:900px){.hero .g{grid-template-columns:1fr}}.cta{display:flex;flex-wrap:wrap;gap:12px;margin:26px 0}.note{font-size:.9rem;color:var(--mute);border-left:3px solid var(--blue);padding-left:14px;max-width:520px}
.art{position:relative;border-radius:28px;overflow:hidden;aspect-ratio:4/4.4;background:linear-gradient(160deg,#0A7C9E,var(--navy));box-shadow:0 30px 60px rgba(16,42,92,.28)}.art svg{width:100%;height:100%;display:block}
.float{position:absolute;background:#fff;border-radius:14px;padding:12px 16px;font-weight:700;font-size:.85rem;color:var(--navy);box-shadow:0 12px 30px rgba(16,42,92,.18);display:flex;gap:10px;align-items:center}.float b{width:30px;height:30px;border-radius:9px;background:var(--lblue);color:var(--blue);display:grid;place-items:center}
.grid{display:grid;gap:22px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
@media(max-width:1000px){.g5,.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:var(--r);padding:26px;background:#fff;transition:.2s}.card:hover{transform:translateY(-4px);border-color:#8FD9EC;box-shadow:0 18px 40px rgba(10,147,184,.16)}
.ic{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,#D9F4FB,#B8E8F5);color:var(--blue);display:grid;place-items:center;font-size:1.25rem;margin-bottom:16px}
.dest{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:3/4.15;color:#fff;background:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.6px) 0 0/20px 20px,linear-gradient(180deg,#1F5AAE 0%,#102A5C 100%);border:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;justify-content:flex-end;padding:22px;transition:.25s}.dest:hover{transform:translateY(-6px)}.dest svg{position:absolute;inset:0;width:100%;height:100%}.dest:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(8,22,32,.8))}.dest>*:not(svg){position:relative;z-index:1}.dest h3{color:#fff;margin:0 0 4px;font-size:1.3rem}.dest p{font-size:.86rem;color:#E0EAF8;margin:0 0 10px}.dest span{font-weight:700;font-size:.85rem}.dest .map{position:absolute;inset:auto;top:12px;left:50%;width:80%;max-width:300px;height:auto;aspect-ratio:1;z-index:1;transform:translateX(-50%);transition:transform .35s;filter:drop-shadow(0 8px 16px rgba(0,0,0,.28))}.dest.np:before{content:"";position:absolute;inset:0;background:radial-gradient(65% 50% at 50% 30%,rgba(31,193,224,.42),transparent 72%)}.map .flag{opacity:0;transition:opacity .35s}.dest:hover .map,.dest:focus-visible .map{transform:translateX(-50%) scale(1.07)}.dest:hover .map .flag,.dest:focus-visible .map .flag{opacity:1}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:18px}.step{position:relative;padding-top:54px}.step:before{content:attr(data-n);position:absolute;top:0;left:0;width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--teal));box-shadow:0 6px 16px rgba(10,147,184,.35);color:#fff;display:grid;place-items:center;font-weight:800}.step:after{content:"";position:absolute;top:21px;left:52px;right:-8px;height:2px;background:var(--line)}.step:last-child:after{display:none}
@media(max-width:900px){.steps{grid-template-columns:1fr}.step{padding:0 0 28px 62px}.step:after{top:46px;left:20px;right:auto;width:2px;height:calc(100% - 46px)}}
.split{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}@media(max-width:900px){.split{grid-template-columns:1fr;gap:30px}}
.ticks{list-style:none;padding:0;margin:0}.ticks li{padding:10px 0 10px 32px;position:relative;border-bottom:1px solid var(--line)}.ticks li:before{content:"✓";position:absolute;left:0;color:var(--blue);font-weight:800}.dark .ticks li{border-color:#2F4A7E}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--lblue);color:var(--blue);margin-right:6px}.sample{border:1px dashed var(--blue);background:var(--lblue);color:var(--navy);border-radius:12px;padding:12px 16px;font-size:.9rem;margin-bottom:22px}
.phero{padding:70px 0 50px;background:linear-gradient(180deg,var(--lblue),#fff)}
details{border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:10px;background:#fff}summary{cursor:pointer;font-weight:700;color:var(--navy)}details p{margin:10px 0 0;color:var(--mute)}
label{display:block;font-weight:600;font-size:.9rem;margin:0 0 6px}.f{margin-bottom:18px}input,select,textarea{width:100%;font:inherit;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--text)}input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:3px solid rgba(10,147,184,.18)}
.err{color:#C0262D;font-size:.82rem;margin-top:5px}input[aria-invalid=true],select[aria-invalid=true],textarea[aria-invalid=true]{border-color:#C0262D}
.form{max-width:680px;margin:auto;background:#fff;border:1px solid var(--line);border-radius:24px;padding:34px;box-shadow:0 20px 50px rgba(16,42,92,.07)}@media(max-width:620px){.form{padding:22px}}
.prog{display:flex;gap:6px;margin-bottom:26px}.prog i{flex:1;height:6px;border-radius:6px;background:var(--line);transition:.3s}.prog i.d{background:linear-gradient(90deg,var(--blue),var(--teal))}.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:620px){.row2{grid-template-columns:1fr}}.nv{display:flex;justify-content:space-between;gap:12px;margin-top:10px}
.status{border-radius:14px;padding:16px 18px;margin-top:18px}.warn{background:#FFF7E6;border:1px solid #F5D58A;color:#6B4A00}.ok{background:#E8F7EE;border:1px solid #9AD8B1;color:#14532D}.bad{background:#FDECEC;border:1px solid #F3AEB0;color:#7A1A1F}
.rev dt{font-size:.78rem;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;margin-top:12px}.rev dd{margin:0;font-weight:600}
footer{background:linear-gradient(160deg,var(--navy),#153A7A);color:#C3D3EE;padding:64px 0 30px}footer h3{color:#fff;font-size:1rem}footer a{display:block;padding:4px 0;color:#C3D3EE}footer a:hover{color:#fff}.fg{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:34px}@media(max-width:800px){.fg{grid-template-columns:1fr 1fr}}@media(max-width:520px){.fg{grid-template-columns:1fr}}
.copy{border-top:1px solid #2F4A7E;margin-top:36px;padding-top:20px;font-size:.85rem;text-align:center}.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px}.bar input{max-width:320px}.chip{border:1px solid var(--line);background:#fff;padding:9px 16px;border-radius:99px;cursor:pointer;font:inherit;font-weight:600;font-size:.88rem}.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.fade{animation:in .45s ease both}@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.skip{position:absolute;left:-999px}.skip:focus{left:10px;top:10px;background:#fff;padding:10px;z-index:99}
.joincard{background:linear-gradient(135deg,var(--navy),#1B4A94);color:#fff;border-radius:28px;padding:52px 28px;text-align:center;box-shadow:0 24px 50px rgba(16,42,92,.2)}.joincard h2{color:#fff;max-width:720px;margin:0 auto .5em}.joincard p{color:#C3D3EE;max-width:560px;margin:0 auto 26px}
.links{order:1}.lang{width:auto;order:3;margin-inline-start:14px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-size:.85rem;font-weight:600;color:var(--navy);cursor:pointer}.burger{order:4;margin-inline-start:10px}
html[lang=ar] body,html[lang=ar] input,html[lang=ar] select,html[lang=ar] textarea,html[lang=ar] button{font-family:'Cairo','Plus Jakarta Sans',system-ui,sans-serif}html[lang=ar] h1,html[lang=ar] h2,html[lang=ar] h3{letter-spacing:0;line-height:1.3}html[lang=ar] .eyebrow{letter-spacing:0;text-transform:none}
[dir=rtl] .ticks li{padding:10px 32px 10px 0}[dir=rtl] .ticks li:before{left:auto;right:0}[dir=rtl] .note{border-left:0;border-right:3px solid var(--blue);padding-left:0;padding-right:14px}[dir=rtl] .step:before{left:auto;right:0}[dir=rtl] .step:after{left:-8px;right:52px}[dir=rtl] .skip{left:auto;right:-999px}[dir=rtl] .skip:focus{right:10px}[dir=rtl] input[type=checkbox],[dir=rtl] input[type=radio]{margin-right:0!important;margin-left:8px}[dir=rtl] .bar input{max-width:320px}
@media(max-width:900px){[dir=rtl] .step{padding:0 62px 28px 0}[dir=rtl] .step:after{top:46px;right:20px;left:auto;width:2px}}
.soc{display:flex;gap:8px;margin-top:18px;flex-wrap:nowrap}.soc a{flex:none;width:38px;height:38px;padding:0;border-radius:50%;border:1.5px solid rgba(255,255,255,.55);color:#fff;display:grid;place-items:center;transition:.2s}.soc a:hover{background:#fff;color:var(--navy)}
.acct{order:2;margin-inline-start:14px;width:40px;height:40px;flex:none;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--navy);background:#fff}.acct:hover{background:var(--lblue)}.authsoc{display:grid;gap:10px;margin:18px 0}.authsoc .btn{width:100%;justify-content:center;font-weight:600}.or{display:flex;align-items:center;gap:12px;color:var(--mute);font-size:.85rem;margin:6px 0 16px}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}.linkbtn{background:none;border:0;color:var(--blue);font:inherit;font-weight:600;cursor:pointer;padding:0}.tabs{justify-content:center}.phrow{display:grid;grid-template-columns:110px 1fr;gap:10px}
.mback{position:fixed;inset:0;z-index:100;background:rgba(10,25,50,.55);display:grid;place-items:center;padding:16px}.mdlg{background:#fff;border-radius:20px;max-width:720px;width:100%;max-height:min(86vh,720px);display:flex;flex-direction:column;box-shadow:0 30px 70px rgba(0,0,0,.35);outline:0}.mhd{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 22px 0}.mhd h3{margin:0}.mhd .x{background:none;border:0;font-size:1.8rem;line-height:1;cursor:pointer;color:var(--mute);width:40px;height:40px;flex:none}.mdlg .tabs{padding:12px 22px 0;margin:0}.mbd{overflow:auto;padding:6px 22px 10px;flex:1}.mft{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px 18px;border-top:1px solid var(--line)}
</style>

const POSTS=[
 {id:"welcome-to-campus-etudiant",t:"Welcome to Campus Étudiant: your partner for studying abroad",cat:"About Campus Étudiant",tag:"Introduction",min:4,ex:"Who we are, where we can send you, and how we support you from your first idea to your departure.",body:[
  "Dreaming of studying abroad? You are not alone, and you do not have to work it out alone either.",
  "Campus Étudiant is a study-abroad guidance team for students who want to continue their studies in Italy, Spain, France, Poland or Portugal. We stay by your side through the whole journey: choosing the right program, preparing your application, and getting ready to leave.",
  "## Who we help",

 وتوقيعك (الاسم الكامل والتاريخ)."],["Documents you provide for your application, such as transcripts, diplomas, CV and motivation letters.","Documents que vous fournissez pour votre candidature : relevés de notes, diplômes, CV et lettres de motivation.","الوثائق التي تقدمها لطلبك مثل كشوف النقاط والشهادات والسيرة الذاتية ورسائل الدافع."]],

["h","4. Consent","4. Consentement","4. الموافقة"],
["p","We process your personal information on the basis of the consent you give when you submit our application form, including your consent for us to collect, store and process your information solely to evaluate your application and provide study-abroad services. You may withdraw your consent at any time by contacting us, although we may then be unable to continue providing some or all of our services.","Nous traitons vos informations personnelles sur la base du consentement que vous donnez en envoyant notre formulaire de candidature, notamment pour que nous les collections, conservions et traitions uniquement afin d'évaluer votre candidature et de fournir des services d'études à l'étranger. Vous pouvez retirer votre consentement à tout moment en nous contactant, mais nous pourrions alors ne plus pouvoir fournir tout ou partie de nos services.","نعالج معلوماتك الشخصية استنادًا إلى موافقتك عند إرسال استمارة التقديم، ومنها موافقتك على جمعها وحفظها ومعالجتها فقط لتقييم طلبك وتقديم خدمات الدراسة في الخارج. يمكنك سحب موافقتك في أي وقت بالتواصل معنا، وقد لا نتمكن حينها من مواصلة تقديم بعض خدماتنا أو كلها."],

["p","We take reasonable measures to protect your information against unauthorized access, loss or misuse. No method of transmission or storage is completely secure, so we cannot guarantee absolute security. We keep your information only for as long as needed to provide our services, meet our legal obligations and resolve disputes.","Nous prenons des mesures raisonnables pour protéger vos informations contre l'accès non autorisé, la perte ou l'utilisation abusive. Aucune méthode de transmission ou de stockage n'étant totalement sûre, nous ne pouvons garantir une sécurité absolue. Nous ne conservons vos informations que le temps nécessaire pour fournir nos services, respecter nos obligations légales et régler les litiges.","نتخذ إجراءات معقولة لحماية معلوماتك من الوصول غير المصرح به أو الفقدان أو سوء الاستخدام. ولأنه لا توجد طريقة نقل أو تخزين آمنة تمامًا، لا يمكننا ضمان أمان مطلق. نحتفظ بمعلوماتك فقط للمدة اللازمة لتقديم خدماتنا والوفاء بالتزاماتنا القانونية وحل النزاعات."],
["h","8. Your rights","8. Vos droits","8. حقوقك"],
["p","You may contact us at any time to ask for access to your information, to correct it, to request its deletion or to withdraw your consent. We will reply as soon as possible, subject to applicable law and to any information we are required to keep.","Vous pouvez nous contacter à tout moment pour demander l'accès à vos informations, leur correction, leur suppression ou pour retirer votre consentement. Nous répondrons dès que possible, sous réserve de la loi applicable et des informations que nous devons conserver.","يمكنك التواصل معنا في أي وقت لطلب الاطلاع على معلوماتك أو تصحيحها أو حذفها أو سحب موافقتك. سنرد في أقرب وقت ممكن، مع مراعاة القانون المعمول به وأي معلومات يجب علينا الاحتفاظ بها."],

كم إلى الخطوات التالية.</p><p><strong>فريق Campus Étudiant</strong></p></div></div>`;

["Renowned universities, strong public higher education and Campus France procedures for international applicants.","Universités renommées, enseignement supérieur public de qualité et procédures Campus France pour les candidats internationaux.","جامعات مرموقة وتعليم عالٍ حكومي قوي وإجراءات Campus France للمتقدمين الدوليين."],
["Historic universities, regional study-support systems and a rich academic and cultural setting.","Universités historiques, dispositifs régionaux d'aide aux études et riche environnement académique et culturel.","جامعات عريقة وأنظمة إقليمية لدعم الطلاب وبيئة أكاديمية وثقافية غنية."],
["A broad range of public and private universities in vibrant, internationally minded cities.","Un large choix d'universités publiques et privées dans des villes dynamiques et ouvertes sur le monde.","مجموعة واسعة من الجامعات الحكومية والخاصة في مدن نابضة بالحياة ومنفتحة على العالم."],
["Growing international offer, modern campuses and many English-taught programs.","Offre internationale en pleine croissance, campus modernes et de nombreux programmes en anglais.","عروض دولية متنامية وحرم جامعية حديثة وبرامج كثيرة تُدرَّس بالإنجليزية."],
["Welcoming universities in Lisbon, Porto and beyond, with a growing international community.","Universités accueillantes à Lisbonne, Porto et ailleurs, avec une communauté internationale grandissante.","جامعات مضيافة في لشبونة وبورتو وغيرهما، مع مجتمع دولي متنامٍ."],
["Many programs are taught in French; some Master's programs are offered in English.","De nombreux programmes sont enseignés en français ; certains masters sont proposés en anglais.","تُدرَّس برامج كثيرة بالفرنسية، وتتوفر بعض برامج الماستر بالإنجليزية."],
["Large student cities, public transport discounts and a wide range of cultural life.","Grandes villes étudiantes, réductions sur les transports et vie culturelle très variée.","مدن طلابية كبيرة وتخفيضات في النقل العام وحياة ثقافية متنوعة."],
["Italian-taught and English-taught programs both exist; check each program.","Il existe des programmes en italien et en anglais ; vérifiez chaque programme.","تتوفر برامج بالإيطالية وأخرى بالإنجليزية؛ تحقق من كل برنامج."],
["Compact historic university cities with a strong student community.","Villes universitaires historiques à taille humaine, avec une forte communauté étudiante.","مدن جامعية تاريخية صغيرة الحجم ذات مجتمع طلابي قوي."],
["Spanish is the main language of instruction; some programs are in English.","L'espagnol est la principale langue d'enseignement ; certains programmes sont en anglais.","الإسبانية هي لغة التدريس الرئيسية، وبعض البرامج بالإنجليزية."],
["Warm climate, lively cities and a relaxed student lifestyle.","Climat chaud, villes animées et mode de vie étudiant détendu.","مناخ دافئ ومدن حيوية ونمط حياة طلابي مريح."],
["A strong selection of English-taught programs, plus Polish-taught ones.","Un large choix de programmes en anglais, ainsi que des programmes en polonais.","مجموعة كبيرة من البرامج بالإنجليزية إضافة إلى برامج بالبولندية."],
["Historic and modern cities with an active international student scene.","Villes historiques et modernes avec une vie étudiante internationale active.","مدن تاريخية وحديثة مع حياة طلابية دولية نشطة."],
["Portuguese is the main language; English-taught options are available in some fields.","Le portugais est la langue principale ; des options en anglais existent dans certains domaines.","البرتغالية هي اللغة الرئيسية، وتتوفر خيارات بالإنجليزية في بعض التخصصات."],
["Coastal cities, relaxed pace and an international atmosphere.","Villes côtières, rythme détendu et ambiance internationale.","مدن ساحلية ووتيرة هادئة وأجواء دولية."],

["University & program research","Recherche d'universités et de programmes","البحث عن الجامعات والبرامج"],["Compare programs, language of instruction and entry requirements on official university websites.","Comparez programmes, langue d'enseignement et conditions d'admission sur les sites officiels des universités.","قارن البرامج ولغة التدريس وشروط القبول على المواقع الرسمية للجامعات."],

["Tuition & costs","Frais de scolarité et coûts","الرسوم والتكاليف"],["Fees differ by country, institution and student status. Figures here are never listed as official — always verify.","Les frais varient selon le pays, l'établissement et le statut de l'étudiant. Les chiffres ne sont jamais officiels : vérifiez toujours.","تختلف الرسوم حسب الدولة والمؤسسة ووضع الطالب. لا تُعرض هنا أرقام رسمية، فتحقق دائمًا."],
["Application procedures","Procédures de candidature","إجراءات التقديم"],["Each country and university has its own platform, documents and deadlines.","Chaque pays et chaque université a sa propre plateforme, ses documents et ses délais.","لكل دولة وجامعة منصتها ووثائقها ومواعيدها الخاصة."],
["Student life","Vie étudiante","الحياة الطلابية"],["Housing, transport and local administration vary by city — research early.","Logement, transport et administration locale varient selon la ville : renseignez-vous tôt.","يختلف السكن والنقل والإدارة المحلية من مدينة لأخرى، فابحث مبكرًا."],
["General visa information","Informations générales sur le visa","معلومات عامة عن التأشيرة"],["Student visa rules are set by official authorities and change over time. Consult the embassy or consulate.","Les règles du visa étudiant sont fixées par les autorités officielles et évoluent. Consultez l'ambassade ou le consulat.","تحدد الجهات الرسمية قواعد تأشيرة الدراسة وهي تتغير مع الوقت. استشر السفارة أو القنصلية."],
["FAQ","FAQ","الأسئلة الشائعة"],["Frequently asked questions","Questions fréquentes","الأسئلة المتكررة"],
["Does Campus Étudiant guarantee admission or a visa?","Campus Étudiant garantit-il l'admission ou le visa ?","هل تضمن Campus Étudiant القبول أو التأشيرة؟"],["No. Admission is decided by universities and visas by the competent authorities. We provide guidance and help you prepare a well-organized file.","Non. L'admission est décidée par les universités et le visa par les autorités compétentes. Nous vous guidons et vous aidons à préparer un dossier bien organisé.","لا. القبول تقرره الجامعات والتأشيرة تقررها الجهات المختصة. نحن نقدّم التوجيه ونساعدك على إعداد ملف منظّم."],
["Which destinations do you support?","Quelles destinations accompagnez-vous ?","ما الوجهات التي ترافقونها؟"],["France, Italy, Spain, Poland and Portugal, and other European destinations when appropriate.","La France, l'Italie, l'Espagne, la Pologne et le Portugal, ainsi que d'autres destinations européennes si pertinent.","فرنسا وإيطاليا وإسبانيا وبولندا والبرتغال، ووجهات أوروبية أخرى عند الاقتضاء."],
["Are tuition fees and deadlines listed on this site?","Les frais et les délais figurent-ils sur ce site ?","هل الرسوم والمواعيد مذكورة في هذا الموقع؟"],["Only as general guidance. Always verify current fees, deadlines and requirements with official university and government sources.","Seulement à titre indicatif. Vérifiez toujours les frais, délais et conditions actuels auprès des sources officielles.","فقط كإرشاد عام. تحقق دائمًا من الرسوم والمواعيد والشروط الحالية من المصادر الرسمية للجامعات والحكومات."],
["How do I start?","Comment commencer ?","كيف أبدأ؟"],["Fill in the application form. It only takes a few minutes and helps us understand your goals.","Remplissez le formulaire de candidature. Cela ne prend que quelques minutes et nous aide à comprendre vos objectifs.","املأ استمارة التقديم. تستغرق دقائق قليلة وتساعدنا على فهم أهدافك."],

["Application and Admissions Assistance","Aide à la candidature et à l'admission","المساعدة في التقديم والقبول"],["Guidance preparing and organizing every application file and deadline.","Aide à la préparation et à l'organisation de chaque dossier et de chaque délai.","توجيه لتحضير وتنظيم كل ملف تقديم وكل موعد."],["Applicants applying to one or several institutions.","Candidats qui postulent dans un ou plusieurs établissements.","متقدمون إلى مؤسسة أو عدة مؤسسات."],["A document checklist, timeline and review of your application file.","Une liste de documents, un calendrier et une relecture de votre dossier.","قائمة بالوثائق وجدول زمني ومراجعة لملف طلبك."],

["Student Visa Guidance","Accompagnement visa étudiant","التوجيه بشأن تأشيرة الدراسة"],["Help understanding and organizing the documents typically requested for a student visa.","Aide pour comprendre et organiser les documents généralement demandés pour un visa étudiant.","مساعدة على فهم وتنظيم الوثائق المطلوبة عادةً لتأشيرة الدراسة."],["Admitted students preparing a visa file.","Étudiants admis qui préparent leur dossier de visa.","طلاب مقبولون يحضّرون ملف التأشيرة."],["A document checklist based on official sources. Decisions remain with the authorities.","Une liste de documents basée sur les sources officielles. La décision revient aux autorités.","قائمة وثائق مبنية على مصادر رسمية. القرار يبقى بيد السلطات."],

["Welcome to Campus Étudiant: your partner for studying abroad","Bienvenue chez Campus Étudiant : votre partenaire pour étudier à l'étranger","مرحبًا بكم في Campus Étudiant: شريككم للدراسة في الخارج"],
["Who we are, where we can send you, and how we support you from your first idea to your departure.","Qui nous sommes, où nous pouvons vous envoyer et comment nous vous accompagnons de votre première idée jusqu'à votre départ.","من نحن، وإلى أين يمكننا إرسالك، وكيف نرافقك من فكرتك الأولى حتى سفرك."],
["Dreaming of studying abroad? You are not alone, and you do not have to work it out alone either.","Vous rêvez d'étudier à l'étranger ? Vous n'êtes pas seul(e), et vous n'avez pas à tout organiser seul(e).","هل تحلم بالدراسة في الخارج؟ لست وحدك، ولا يجب أن تتدبّر الأمر وحدك."],
["Campus Étudiant is a study-abroad guidance team for students who want to continue their studies in Italy, Spain, France, Poland or Portugal. We stay by your side through the whole journey: choosing the right program, preparing your application, and getting ready to leave.","Campus Étudiant est une équipe d'accompagnement pour les étudiants qui souhaitent poursuivre leurs études en Italie, en Espagne, en France, en Pologne ou au Portugal. Nous restons à vos côtés tout au long du parcours : choisir le bon programme, préparer votre candidature et vous préparer au départ.","Campus Étudiant فريق توجيه للطلاب الراغبين في متابعة دراستهم في إيطاليا أو إسبانيا أو فرنسا أو بولندا أو البرتغال. نبقى إلى جانبك طوال الرحلة: اختيار البرنامج المناسب، وتحضير طلبك، والاستعداد للسفر."],
["Who we help","Qui nous accompagnons","من نساعد"],["We work with students finishing high school, a bachelor's or a master's degree who want to apply to a university in Europe. Whether you already know your destination or you are still comparing options, we start from your profile, your goals and your budget.","Nous travaillons avec des étudiants qui terminent le lycée, une licence ou un master et souhaitent candidater dans une université européenne. Que vous connaissiez déjà votre destination ou que vous compariez encore les options, nous partons de votre profil, de vos objectifs et de votre budget.","نعمل مع طلاب ينهون الثانوية أو الإجازة أو الماستر ويرغبون في التقديم إلى جامعة أوروبية. سواء كنت تعرف وجهتك أم ما زلت تقارن الخيارات، ننطلق من ملفك وأهدافك وميزانيتك."],

["What you can expect from us","Ce que vous pouvez attendre de nous","ما يمكنك توقعه منا"],["Honest guidance. Universities decide on admissions and the authorities decide on visas, so nobody can promise you a result, and we will never do so. What we can do is give you clear information, a well-organized file and a team that answers your questions at every step.","Un accompagnement honnête. Les universités décident des admissions et les autorités des visas : personne ne peut vous promettre un résultat, et nous ne le ferons jamais. Nous pouvons en revanche vous offrir des informations claires, un dossier bien organisé et une équipe qui répond à vos questions à chaque étape.","توجيه صادق. الجامعات تقرر القبول والسلطات تقرر التأشيرات، لذلك لا أحد يستطيع أن يعدك بنتيجة، ونحن لن نفعل ذلك أبدًا. ما نستطيع تقديمه هو معلومات واضحة وملف منظّم وفريق يجيب عن أسئلتك في كل خطوة."],
["Ready to start?","Prêt(e) à commencer ?","هل أنت مستعد للبدء؟"],["Fill in the application form, or write to us on WhatsApp or at campus.etu@gmail.com. Our team will review your file and get back to you as soon as possible to explain the next steps.","Remplissez le formulaire de candidature ou écrivez-nous sur WhatsApp ou à campus.etu@gmail.com. Notre équipe étudiera votre dossier et vous répondra dès que possible pour vous expliquer les prochaines étapes.","املأ استمارة التقديم أو راسلنا عبر واتساب أو على campus.etu@gmail.com. سيراجع فريقنا ملفك ويتواصل معك في أقرب وقت لشرح الخطوات التالية."],["Contact Us","Nous contacter","تواصل معنا"],

["Legal","Mentions légales","قانوني"],["Privacy Policy & Terms","Politique de confidentialité et conditions","سياسة الخصوصية والشروط"],["Template placeholder — have a qualified professional provide the final privacy policy and terms of service before launch.","Texte provisoire : faites rédiger la politique de confidentialité et les conditions d'utilisation définitives par un professionnel qualifié avant le lancement.","نص مؤقت: يجب أن يعدّ مختص مؤهل سياسة الخصوصية وشروط الخدمة النهائية قبل الإطلاق."],["Information you submit through the forms is used only to respond to your request and to prepare your guidance. Do not submit information you are not comfortable sharing. Contact us to request access to or deletion of your data.","Les informations envoyées via les formulaires servent uniquement à répondre à votre demande et à préparer votre accompagnement. N'envoyez pas d'informations que vous ne souhaitez pas partager. Contactez-nous pour demander l'accès à vos données ou leur suppression.","تُستخدم المعلومات التي ترسلها عبر النماذج فقط للرد على طلبك وتحضير توجيهك. لا ترسل معلومات لا ترتاح لمشاركتها. تواصل معنا لطلب الاطلاع على بياناتك أو حذفها."],
["Refund Policy","Politique de remboursement","سياسة الاسترداد"],["How refunds work for Campus Étudiant services.","Comment fonctionnent les remboursements pour les services de Campus Étudiant.","كيف تعمل عمليات الاسترداد لخدمات Campus Étudiant."],["Draft policy — please review and complete the exact conditions (deadlines, percentages, payment methods) with a qualified professional before launch.","Politique provisoire : faites vérifier et compléter les conditions exactes (délais, pourcentages, moyens de paiement) par un professionnel qualifié avant le lancement.","سياسة مبدئية: يرجى مراجعة الشروط الدقيقة (المواعيد والنسب وطرق الدفع) واستكمالها مع مختص مؤهل قبل الإطلاق."],["Our services","Nos services","خدماتنا"],["Campus Étudiant provides guidance and support services for admissions, applications, student visa preparation and related procedures. Each service is explained to you before you start.","Campus Étudiant propose des services d'accompagnement pour les admissions, les candidatures, la préparation du visa étudiant et les démarches associées. Chaque service vous est expliqué avant le début.","تقدّم Campus Étudiant خدمات توجيه ودعم للقبول والتقديم وتحضير تأشيرة الدراسة والإجراءات المرتبطة بها. يُشرح لك كل نوع من الخدمات قبل البدء."],["Refund requests","Demandes de remboursement","طلبات الاسترداد"],["To request a refund, contact us in writing by email at campus.etu@gmail.com or on WhatsApp, with your full name and the service concerned. We review every request individually and reply as soon as possible.","Pour demander un remboursement, écrivez-nous par e-mail à campus.etu@gmail.com ou sur WhatsApp en indiquant votre nom complet et le service concerné. Nous étudions chaque demande individuellement et répondons dès que possible.","لطلب الاسترداد، راسلنا كتابيًا عبر البريد campus.etu@gmail.com أو واتساب مع ذكر اسمك الكامل والخدمة المعنية. ندرس كل طلب على حدة ونرد في أقرب وقت."],["When a refund may be considered","Quand un remboursement peut être envisagé","متى يمكن النظر في الاسترداد"],["You paid for a service that has not yet started.","Vous avez payé un service qui n'a pas encore commencé.","دفعتَ ثمن خدمة لم تبدأ بعد."],["A service could not be delivered by Campus Étudiant for reasons within our control.","Campus Étudiant n'a pas pu fournir un service pour des raisons qui dépendent de nous.","تعذّر على Campus Étudiant تقديم خدمة لأسباب تعود إلينا."],["A payment was made in error or charged twice.","Un paiement a été effectué par erreur ou prélevé deux fois.","تم دفع مبلغ بالخطأ أو خصمه مرتين."],["What is not refundable","Ce qui n'est pas remboursable","ما لا يمكن استرداده"],["Services already delivered or in progress, in proportion to the work completed.","Les services déjà fournis ou en cours, proportionnellement au travail effectué.","الخدمات التي قُدّمت أو قيد التنفيذ، بما يتناسب مع العمل المنجز."],["Fees paid to third parties, such as universities, application platforms, Campus France, embassies, consulates, translators or test centers.","Les frais versés à des tiers : universités, plateformes de candidature, Campus France, ambassades, consulats, traducteurs ou centres d'examen.","الرسوم المدفوعة لأطراف ثالثة مثل الجامعات ومنصات التقديم وCampus France والسفارات والقنصليات والمترجمين ومراكز الاختبار."],["Refusal of admission or of a visa. Decisions are taken by universities and authorities, and we cannot guarantee any outcome.","Le refus d'une admission ou d'un visa. Les décisions sont prises par les universités et les autorités, et nous ne pouvons garantir aucun résultat.","رفض القبول أو التأشيرة. القرارات تتخذها الجامعات والسلطات ولا يمكننا ضمان أي نتيجة."],["Delays or failure caused by incomplete, late or inaccurate information or documents provided by the student.","Les retards ou échecs dus à des informations ou documents incomplets, tardifs ou inexacts fournis par l'étudiant.","التأخير أو الإخفاق الناتج عن معلومات أو وثائق ناقصة أو متأخرة أو غير دقيقة قدّمها الطالب."],["How refunds are paid","Comment les remboursements sont effectués","كيف يتم دفع المبالغ المستردة"],["Approved refunds are returned using the same payment method whenever possible, within a reasonable time after approval.","Les remboursements approuvés sont effectués par le même moyen de paiement lorsque c'est possible, dans un délai raisonnable après approbation.","تُعاد المبالغ المعتمدة بنفس طريقة الدفع كلما أمكن، خلال مدة معقولة بعد الموافقة."],["Questions","Questions","أسئلة"],["If you have any questions about this policy, please contact us before making a payment.","Pour toute question sur cette politique, contactez-nous avant d'effectuer un paiement.","إذا كانت لديك أسئلة حول هذه السياسة، يرجى التواصل معنا قبل إجراء أي دفعة."],["Campus Étudiant. All rights reserved.","Campus Étudiant. Tous droits réservés.","Campus Étudiant. جميع الحقوق محفوظة."],

const TRM=new Map(DICT.map(r=>[r[0],{fr:r[1],ar:r[2]}]));
let LANG="en";Object.values(LEGAL).forEach(a=>a.forEach(it=>{if(it[0]==="u")it.slice(1).forEach(x=>TRM.set(x[0],{fr:x[1],ar:x[2]}));else TRM.set(it[1],{fr:it[2],ar:it[3]})}));LLEAD.forEach(x=>TRM.set(x[0],{fr:x[1],ar:x[2]}));
const CN={France:["France","فرنسا"],Italy:["Italie","إيطاليا"],Spain:["Espagne","إسبانيا"],Poland:["Pologne","بولندا"],Portugal:["Portugal","البرتغال"]};
const PAT=[
 [/^(\d+) min read$/,(m,l)=>l==="fr"?`${m[1]} min de lecture`:`قراءة ${m[1]} دقائق`],
 [/^Study in (.+)$/,(m,l)=>{const c=CN[m[1]];if(!c)return null;return l==="fr"?`Étudier ${m[1]==="Portugal"?"au":"en"} ${c[0]}`:`الدراسة في ${c[1]}`}],
 [/^Page (\d+) of (\d+)$/,(m,l)=>l==="fr"?`Page ${m[1]} sur ${m[2]}`:`الصفحة ${m[1]} من ${m[2]}`],
 [/^Thank you, (.*)\. Our team will review your application and contact you as soon as possible\.$/,(m,l)=>l==="fr"?`Merci, ${m[1]}. Notre équipe étudiera votre candidature et vous contactera dès que possible.`:`شكرًا لك، ${m[1]}. سيراجع فريقنا طلبك ويتواصل معك في أقرب وقت.`],
 [/^Tuition, deadlines, admission criteria and visa requirements change\. Always confirm with the university and the official government sources for (.+)\.$/,(m,l)=>{const c=CN[m[1]]||[m[1],m[1]];return l==="fr"?`Les frais, délais, critères d'admission et conditions de visa évoluent. Confirmez toujours auprès de l'université et des sources gouvernementales officielles pour ${c[0]}.`:`تتغير الرسوم والمواعيد ومعايير القبول وشروط التأشيرة. تأكد دائمًا من الجامعة والمصادر الحكومية الرسمية الخاصة بـ ${c[1]}.`}]
];
function trs(core,l){const v=TRM.get(core);if(v)return v[l];for(const[re,fn]of PAT){const m=core.match(re);if(m){const r=fn(m,l);if(r!=null)return r}}return null}
function tr(str){if(LANG==="en")return str;const lead=str.match(/^\s*/)[0],trail=str.match(/\s*$/)[0];let core=str.trim();if(!core)return str;let star="";if(/ \*$/.test(core)){star=" *";core=core.slice(0,-2)}
 const l=LANG;let r=trs(core,l);
 if(r==null){const m=core.match(/^([^\p{L}\p{N}]+)(.+)$/su);if(m){const x=trs(m[2],l);if(x!=null)r=m[1]+x}}
 if(r==null&&core.includes(" · ")){r=core.split(" · ").map(p=>{const m=p.match(/^([^\p{L}\p{N}]*)(.+)$/su),x=m&&trs(m[2],l);return x!=null?m[1]+x:p}).join(" · ")}
 return r==null?str:lead+r+star+trail}
const ORIG=new WeakMap(),ORIGA=new WeakMap();
function tx(n){const p=n.parentElement;if(!p||p.closest("[data-notr],script,style"))return;const o=ORIG.has(n)?ORIG.get(n):n.data;ORIG.set(n,o);const t=LANG==="en"?o:tr(o);if(n.data!==t)n.data=t}
function ax(el){["placeholder","aria-label","title"].forEach(a=>{if(!el.hasAttribute(a))return;const mp=ORIGA.get(el)||{};const o=a in mp?mp[a]:el.getAttribute(a);mp[a]=o;ORIGA.set(el,mp);const t=LANG==="en"?o:tr(o);if(el.getAttribute(a)!==t)el.setAttribute(a,t)})}
function applyTo(root){if(!root)return;if(root.nodeType===3){tx(root);return}if(root.nodeType!==1)return;
 root.querySelectorAll("option:not([value])").forEach(o=>o.setAttribute("value",o.textContent));
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),list=[];let n;while(n=w.nextNode())list.push(n);list.forEach(tx);
 [root,...root.querySelectorAll("[placeholder],[aria-label],[title]")].forEach(ax)}
function setLang(l){LANG=l;const h=document.documentElement;h.lang=l;h.dir=l==="ar"?"rtl":"ltr";try{localStorage.setItem("ce_lang",l)}catch(e){}$("#lg").value=l;shell();route();applyTo(document.body)}
new MutationObserver(ms=>{if(LANG==="en")return;ms.forEach(m=>m.addedNodes.forEach(applyTo))}).observe(document.body,{childList:true,subtree:true});
$("#lg").addEventListener("change",e=>setLang(e.target.value));
window.addEventListener("hashchange",route);setLang((()=>{try{const v=localStorage.getItem("ce_lang");return["en","fr","ar"].includes(v)?v:"en"}catch(e){return"en"}})());
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard — Campus Étudiant</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap">
<style>
:root{--navy:#102A5C;--blue:#0A93B8;--teal:#1FC1E0;--lb:#E0F6FC;--bg:#F1FAFD;--tx:#12264A;--mu:#52697C;--ln:#D3E8F0;--sf:#fff;--ok:#14803C;--okb:#E8F7EE;--wr:#8A5A00;--wrb:#FFF4DC;--bd:#B42318;--bdb:#FDECEC;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0C1A33;--sf:#13264A;--tx:#E6EEFB;--mu:#9FB3CF;--ln:#274068;--lb:#16335E;--navy:#BFD6FF;--okb:#12341F;--ok:#7BDDA0;--wrb:#3A2D0B;--wr:#F3CB77;--bdb:#3C1713;--bd:#FFA59B;color-scheme:dark}}
*,*:before,*:after{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:15px/1.55 'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx)}
h1,h2,h3{margin:0 0 .4em;color:var(--navy);letter-spacing:-.01em;line-height:1.2}h1{font-size:1.6rem}h2{font-size:1.15rem}h3{font-size:1rem}p{margin:0 0 .8em}
button,input,select,textarea{font:inherit;color:inherit}:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:#102A5C;color:#C3D3EE;padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
aside .brand{color:#fff;font-weight:800;font-size:1.1rem;padding:4px 10px 14px}aside .brand small{display:block;font-weight:500;color:#8FB0E6;font-size:.75rem}
.nav{display:flex;gap:10px;align-items:center;padding:10px 12px;border:0;background:none;border-radius:10px;color:inherit;cursor:pointer;text-align:start;width:100%}
.nav:hover{background:#1B3F7C}.nav.on{background:#fff;color:#102A5C;font-weight:700}.nav .n{margin-inline-start:auto;background:#D62828;color:#fff;border-radius:99px;font-size:.72rem;padding:1px 8px}
.role{margin-top:auto;background:#1B3F7C;border-radius:12px;padding:10px;font-size:.8rem}.role b{color:#fff;display:block;margin-bottom:6px}
.seg{display:flex;background:#0C204A;border-radius:99px;padding:3px}.seg button{flex:1;border:0;background:none;color:#C3D3EE;border-radius:99px;padding:6px;cursor:pointer;font-weight:600}.seg button.on{background:#1FC1E0;color:#06243A}
main{padding:28px clamp(16px,4vw,40px) 60px;max-width:1100px;width:100%}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:22px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:20px;margin-bottom:16px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ln);background:var(--sf);color:var(--navy);border-radius:99px;padding:8px 16px;font-weight:700;cursor:pointer}
.btn.p{background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff;border-color:transparent}.btn.s{padding:5px 12px;font-size:.85rem}.btn:disabled{opacity:.5;cursor:not-allowed}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:.78rem;font-weight:700;background:var(--lb);color:var(--blue)}.pill.ok{background:var(--okb);color:var(--ok)}.pill.wr{background:var(--wrb);color:var(--wr)}.pill.bd{background:var(--bdb);color:var(--bd)}
.mu{color:var(--mu)}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}
/* journey tracker: the one memorable element */
.trk{display:grid;grid-template-columns:repeat(6,1fr);gap:0;margin:22px 0 6px;position:relative}
.trk li{list-style:none;text-align:center;position:relative;font-size:.82rem;padding:0 4px}
.trk li:before{content:"";position:absolute;top:15px;inset-inline:-50% 50%;height:4px;background:var(--ln)}.trk li:first-child:before{display:none}.trk li.d:before,.trk li.c:before{background:var(--blue)}
.dot{position:relative;z-index:1;width:34px;height:34px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;background:var(--sf);border:3px solid var(--ln);font-weight:800;color:var(--mu)}
.trk .d .dot{background:var(--blue);border-color:var(--blue);color:#fff}.trk .c .dot{border-color:var(--blue);color:var(--blue);box-shadow:0 0 0 6px var(--lb)}.trk .c{font-weight:800;color:var(--navy)}
ol.trk{padding:0}
label{display:block;font-weight:600;font-size:.85rem;margin:0 0 4px}.f{margin-bottom:14px}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--ln);border-radius:10px;background:var(--sf)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
table{width:100%;border-collapse:collapse}th,td{text-align:start;padding:10px 8px;border-bottom:1px solid var(--ln);vertical-align:middle}th{font-size:.8rem;color:var(--mu)}
.scroll{overflow-x:auto}
.chat{max-height:340px;overflow:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.b{max-width:80%;padding:9px 13px;border-radius:14px;background:var(--lb)}.b.me{align-self:flex-end;background:var(--blue);color:#fff}.b small{display:block;opacity:.7;font-size:.72rem}
.toast{position:fixed;inset-inline-end:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#102A5C;color:#fff;padding:12px 18px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:9}
.tabs{display:none}
@media(max-width:860px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}aside .brand{width:100%}.nav{width:auto;padding:8px 12px}.role{width:100%;margin-top:6px}
.trk{grid-template-columns:1fr;gap:14px}.trk li{display:flex;gap:12px;align-items:center;text-align:start}.trk li:before{display:none}.dot{margin:0}.r2{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<aside><div class="brand">Campus Étudiant<small id="who"></small></div><nav id="nav" style="display:contents" aria-label="Dashboard"></nav>
<div class="role"><b>Demo view</b><div class="seg" role="group" aria-label="Switch view"><button data-r="student" class="on">Student</button><button data-r="admin">Admin</button></div></div></aside>
<main id="m" tabindex="-1"></main>
</div>
<div id="t" role="status" aria-live="polite"></div>
<script>
const STAGES=["Profile received","Documents review","Applications sent","Admission","Visa","Departure"];
const DOCN=["Passport","BAC / Degree","Transcripts (relevés de notes)","Legalization or apostille","Motivation letter","CV","Translated documents"];
const SVC=["IELTS preparation","Document translation","Legalization / apostille support","Accommodation search","Visa interview coaching","Pre-departure guidance"];
const mkDocs=a=>DOCN.map((n,i)=>({n,s:a[i]||"missing",f:a[i]&&a[i]!=="missing"?n.split(" ")[0].toLowerCase()+".pdf":""}));
const S=[
{id:0,name:"Amina Benali",email:"amina@example.com",phone:"+213 555 00 11 22",country:"France",level:"Master’s Degree",program:"Data Science",city:"Lyon",stage:1,agr:true,docs:mkDocs(["approved","approved","uploaded","missing","rejected","approved"]),
 msgs:[{f:"team",t:"Welcome Amina! Please upload your legalized transcripts and a new motivation letter.",d:"12 Oct"}],
 pay:[{l:"Initial payment",a:"50,000 DA",s:"paid"},{l:"Second payment",a:"50,000 DA",s:"due"}],
 hist:[{d:"02 Oct",t:"Academic profile evaluation",s:"Done"},{d:"09 Oct",t:"University and programme selection",s:"Done"},{d:"15 Oct",t:"Application documents review",s:"In progress"}],
 ord:[{t:"IELTS preparation",s:"Requested"}]},
{id:1,name:"Yacine Haddad",email:"yacine@example.com",phone:"+213 555 33 44 55",country:"Italy",level:"Bachelor’s Degree",program:"Architecture",city:"Turin",stage:2,agr:true,docs:mkDocs(["approved","approved","approved","approved","approved","approved","uploaded"]),msgs:[],pay:[{l:"Initial payment",a:"50,000 DA",s:"paid"},{l:"Second payment",a:"50,000 DA",s:"paid"}],hist:[{d:"28 Sep",t:"Academic profile evaluation",s:"Done"}],ord:[]},
{id:2,name:"Sara Khelifi",email:"sara@example.com",phone:"+213 555 77 88 99",country:"Poland",level:"Master’s Degree",program:"Computer Science",city:"Warsaw",stage:0,agr:false,docs:mkDocs([]),msgs:[],pay:[{l:"Initial payment",a:"50,000 DA",s:"due"},{l:"Second payment",a:"50,000 DA",s:"due"}],hist:[],ord:[]}
];
const st={role:"student",tab:"overview",sel:0};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const me=()=>S[0],cur=()=>st.role==="admin"?S[st.sel]:S[0];
const DP={missing:["Missing","bd"],uploaded:["In review","wr"],approved:["Approved","ok"],rejected:["Re-upload needed","bd"]};
const pill=(x,k)=>`<span class="pill ${k||""}">${esc(x)}</span>`;
function toast(m){const t=$("#t");t.innerHTML=`<div class="toast">${esc(m)}</div>`;clearTimeout(toast.x);toast.x=setTimeout(()=>t.innerHTML="",2600)}
const unread=s=>s.msgs.filter(m=>m.f==="team"&&!m.r).length;
const TABS={student:[["overview","Overview"],["application","My application"],["documents","Documents"],["messages","Messages"],["payments","Payments & agreement"],["services","Services"]],
 admin:[["students","Students"],["reviews","Document reviews"],["messages","Messages"],["payments","Payments"],["services","Service orders"]]};
function nav(){$("#who").textContent=st.role==="admin"?"Admin team":me().name;
 $("#nav").innerHTML=TABS[st.role].map(([k,l])=>{let n=0;if(st.role==="student"&&k==="messages")n=unread(me());if(st.role==="admin"&&k==="reviews")n=S.reduce((a,s)=>a+s.docs.filter(d=>d.s==="uploaded").length,0);if(st.role==="admin"&&k==="services")n=S.reduce((a,s)=>a+s.ord.filter(o=>o.s==="Requested").length,0);
 return `<button class="nav ${st.tab===k?"on":""}" data-t="${k}">${l}${n?`<span class="n">${n}</span>`:""}</button>`}).join("")}
function head(t,s){return `<div class="top"><div><h1>${t}</h1><p class="mu">${s||""}</p></div></div>`}
function picker(){return st.role==="admin"?`<div class="f" style="max-width:300px"><label for="ps">Student</label><select id="ps">${S.map(s=>`<option value="${s.id}" ${s.id===st.sel?"selected":""}>${esc(s.name)} — ${esc(s.country)}</option>`).join("")}</select></div>`:""}
function tracker(s){return `<ol class="trk" aria-label="Application progress">${STAGES.map((x,i)=>`<li class="${i<s.stage?"d":i===s.stage?"c":""}"${i===s.stage?' aria-current="step"':""}><div class="dot">${i<s.stage?"✓":i+1}</div>${x}</li>`).join("")}</ol>`}
const V={
overview(s){const miss=s.docs.filter(d=>d.s==="missing"||d.s==="rejected").length,due=s.pay.filter(p=>p.s==="due").length;
 return head(`Hello, ${esc(s.name.split(" ")[0])}`,`Your plan: ${esc(s.level)} in ${esc(s.program)}, ${esc(s.country)}.`)+`<div class="card"><h2>Where your application stands</h2>${tracker(s)}<p class="mu" style="margin-top:14px">Current stage: <b>${STAGES[s.stage]}</b>. Universities and authorities make the final decisions on admission and visas.</p></div>
 <div class="grid"><div class="card"><h3>Documents</h3><p><b>${miss}</b> need your action.</p><button class="btn s" data-t="documents">Open checklist</button></div>
 <div class="card"><h3>Messages</h3><p><b>${unread(s)}</b> unread from the team.</p><button class="btn s" data-t="messages">Read messages</button></div>
 <div class="card"><h3>Payments</h3><p><b>${due}</b> payment${due===1?"":"s"} due. Agreement: ${s.agr?pill("Signed","ok"):pill("Not signed yet","wr")}</p><button class="btn s" data-t="payments">View details</button></div></div>`},
application(s){const f=(id,l,v,t="text")=>`<div class="f"><label for="${id}">${l}</label><input id="${id}" type="${t}" value="${esc(v)}"></div>`;
 return head("My application","Keep your main information up to date. The team sees changes right away.")+`<form class="card" id="af"><h2>Main information</h2><div class="r2">${f("a_name","Full name (as in passport)",s.name)}${f("a_email","Email",s.email,"email")}${f("a_phone","Phone / WhatsApp",s.phone,"tel")}${f("a_country","Destination country",s.country)}${f("a_level","Intended studies",s.level)}${f("a_program","Programme",s.program)}</div>${f("a_city","Preferred city or university",s.city)}<button class="btn p" type="submit">Save changes</button></form>
 <div class="card"><h2>Upload documents</h2><p class="mu">Choose the document type, then attach the file (PDF or image). Files are not sent anywhere in this demo.</p><div class="r2"><div class="f"><label for="u_t">Document</label><select id="u_t">${DOCN.map((n,i)=>`<option value="${i}">${n}</option>`).join("")}</select></div><div class="f"><label for="u_f">File</label><input id="u_f" type="file" accept=".pdf,image/*"></div></div><button class="btn p" id="up">Upload document</button></div>`},
documents(s){return head("Documents checklist",`${s.docs.filter(d=>d.s==="approved").length} of ${s.docs.length} approved.`)+picker()+`<div class="card">${s.docs.map((d,i)=>`<div class="row"><div><b>${d.n}</b><div class="mu" style="font-size:.82rem">${d.f?esc(d.f):"No file yet"}</div></div><div style="display:flex;gap:8px;align-items:center">${pill(DP[d.s][0],DP[d.s][1])}${st.role==="student"&&(d.s==="missing"||d.s==="rejected")?`<button class="btn s" data-up="${i}">Upload</button>`:""}${st.role==="admin"&&d.s==="uploaded"?`<button class="btn s" data-ap="${i}">Approve</button><button class="btn s" data-rj="${i}">Reject</button>`:""}</div></div>`).join("")}</div>`},
messages(s){return head("Messages",st.role==="admin"?"Reply to students.":"Write to the Campus Étudiant team. We reply as soon as possible.")+picker()+`<div class="card"><div class="chat" id="ch">${s.msgs.length?s.msgs.map(m=>`<div class="b ${(m.f==="team")===(st.role==="admin")?"me":""}"><small>${m.f==="team"?"Team":esc(s.name.split(" ")[0])} · ${m.d}</small>${esc(m.t)}</div>`).join(""):`<p class="mu">No messages yet. Write the first one below.</p>`}</div><form id="mf" style="display:flex;gap:8px"><label for="mt" style="position:absolute;left:-999px">Message</label><input id="mt" placeholder="Write a message…" required><button class="btn p" type="submit">Send</button></form></div>`},
payments(s){return head("Payments & agreement","Fees are confirmed in your Service Agreement. Amounts below are demo data.")+picker()+`<div class="card"><div class="row"><div><b>Service Agreement</b><div class="mu" style="font-size:.82rem">Needed before work starts</div></div><div style="display:flex;gap:8px;align-items:center">${s.agr?pill("Signed","ok"):pill("Waiting for signature","wr")}${st.role==="admin"&&!s.agr?`<button class="btn s" data-ag>Mark signed</button>`:""}</div></div>${s.pay.map((p,i)=>`<div class="row"><div><b>${p.l}</b><div class="mu" style="font-size:.82rem">${p.a}</div></div><div style="display:flex;gap:8px;align-items:center">${p.s==="paid"?pill("Paid","ok"):pill("Due","wr")}${st.role==="admin"&&p.s==="due"?`<button class="btn s" data-pd="${i}">Mark paid</button>`:""}</div></div>`).join("")}</div><p class="mu">University fees, visa fees, insurance, translation and legalization are paid separately.</p>`},
services(s){if(st.role==="admin")return V.orders();return head("Services","What we have done for you, and extra help you can order.")+`<div class="card"><h2>Services provided</h2>${s.hist.length?s.hist.map(h=>`<div class="row"><div><b>${h.t}</b><div class="mu" style="font-size:.82rem">${h.d}</div></div>${pill(h.s,h.s==="Done"?"ok":"wr")}</div>`).join(""):`<p class="mu">Nothing yet. Your services appear here as we complete them.</p>`}</div>
 <div class="card"><h2>Order an extra service</h2><div class="grid" style="margin-top:10px">${SVC.map((x,i)=>{const o=s.ord.find(o=>o.t===x);return `<div class="card" style="margin:0"><h3>${x}</h3>${o?pill(o.s,o.s==="Requested"?"wr":"ok"):`<button class="btn s" data-os="${i}">Request</button>`}</div>`}).join("")}</div></div>`},
orders(){const all=S.flatMap(s=>s.ord.map(o=>({s,o})));return head("Service orders","Extra services requested by students.")+`<div class="card">${all.length?all.map(({s,o})=>`<div class="row"><div><b>${o.t}</b><div class="mu" style="font-size:.82rem">${esc(s.name)}</div></div><div style="display:flex;gap:8px;align-items:center">${pill(o.s,o.s==="Requested"?"wr":"ok")}${o.s==="Requested"?`<button class="btn s" data-oa="${s.id}|${o.t}">Accept</button>`:""}</div></div>`).join(""):`<p class="mu">No orders yet.</p>`}</div>`},
students(){const s=cur();return head("Students",`${S.length} students in the demo.`)+`<div class="card scroll"><table><thead><tr><th>Name</th><th>Destination</th><th>Stage</th><th>Docs</th><th>Payment</th></tr></thead><tbody>${S.map(x=>`<tr><td><button class="btn s" data-pick="${x.id}">${esc(x.name)}</button></td><td>${esc(x.country)}</td><td>${STAGES[x.stage]}</td><td>${x.docs.filter(d=>d.s==="approved").length}/${x.docs.length}</td><td>${x.pay.every(p=>p.s==="paid")?pill("Paid","ok"):pill("Balance due","wr")}</td></tr>`).join("")}</tbody></table></div>
 <div class="card"><h2>${esc(s.name)}</h2><p class="mu">${esc(s.level)} · ${esc(s.program)} · ${esc(s.country)} · ${esc(s.email)}</p>${tracker(s)}<div style="display:flex;gap:8px;margin-top:10px"><button class="btn s" data-sg="-1" ${s.stage===0?"disabled":""}>Previous stage</button><button class="btn p s" data-sg="1" ${s.stage===5?"disabled":""}>Move to next stage</button></div></div>`},
reviews(){const l=S.flatMap(s=>s.docs.map((d,i)=>({s,d,i})).filter(x=>x.d.s==="uploaded"));return head("Document reviews","Uploaded documents waiting for a decision.")+`<div class="card">${l.length?l.map(({s,d,i})=>`<div class="row"><div><b>${d.n}</b><div class="mu" style="font-size:.82rem">${esc(s.name)} · ${esc(d.f)}</div></div><div style="display:flex;gap:8px"><button class="btn s" data-ra="${s.id}|${i}">Approve</button><button class="btn s" data-rr="${s.id}|${i}">Reject</button></div></div>`).join(""):`<p class="mu">All caught up. No documents are waiting.</p>`}</div>`}
};
function render(){nav();const s=cur(),f=V[st.tab];$("#m").innerHTML=f?f(s):"";const c=$("#ch");c&&(c.scrollTop=c.scrollHeight);
 const ps=$("#ps");ps&&ps.addEventListener("change",e=>{st.sel=+e.target.value;render()});
 const af=$("#af");af&&af.addEventListener("submit",e=>{e.preventDefault();Object.assign(s,{name:$("#a_name").value,email:$("#a_email").value,phone:$("#a_phone").value,country:$("#a_country").value,level:$("#a_level").value,program:$("#a_program").value,city:$("#a_city").value});toast("Changes saved");render()});
 const up=$("#up");up&&up.addEventListener("click",()=>{const f=$("#u_f").files[0];if(!f){toast("Choose a file first");return}const d=s.docs[+$("#u_t").value];d.s="uploaded";d.f=f.name;toast("Document uploaded. The team will review it.");render()});
 const mf=$("#mf");mf&&mf.addEventListener("submit",e=>{e.preventDefault();const t=$("#mt").value.trim();if(!t)return;s.msgs.push({f:st.role==="admin"?"team":"student",t,d:"Today"});if(st.role==="student")s.msgs.forEach(m=>m.r=true);toast("Message sent");render()})}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const s=cur(),d=b.dataset;
 if(d.r){st.role=d.r;st.tab=TABS[d.r][0][0];document.querySelectorAll(".seg button").forEach(x=>x.classList.toggle("on",x===b));return render()}
 if(d.t){st.tab=d.t;if(d.t==="messages"&&st.role==="student")me().msgs.forEach(m=>m.r=true);return render()}
 if(d.up!==undefined){st.tab="application";render();$("#u_t").value=d.up;$("#u_f").focus();return}
 if(d.ap!==undefined||d.rj!==undefined){const i=d.ap!==undefined?d.ap:d.rj;s.docs[i].s=d.ap!==undefined?"approved":"rejected";toast(d.ap!==undefined?"Document approved":"Document sent back to student");return render()}
 if(d.ra||d.rr){const[id,i]=(d.ra||d.rr).split("|");S[id].docs[i].s=d.ra?"approved":"rejected";toast(d.ra?"Document approved":"Document sent back to student");return render()}
 if(d.ag!==undefined){s.agr=true;toast("Agreement marked as signed");return render()}
 if(d.pd!==undefined){s.pay[d.pd].s="paid";toast("Payment marked as paid");return render()}
 if(d.os!==undefined){s.ord.push({t:SVC[d.os],s:"Requested"});toast("Service requested");return render()}
 if(d.oa){const[id,t]=d.oa.split("|");const o=S[id].ord.find(o=>o.t===t);o.s="Accepted";S[id].hist.push({d:"Today",t,s:"In progress"});toast("Order accepted");return render()}
 if(d.pick!==undefined){st.sel=+d.pick;return render()}
 if(d.sg){s.stage=Math.max(0,Math.min(5,s.stage+ +d.sg));toast("Stage updated to "+STAGES[s.stage]);return render()}});
render();
</script>
</body>
</html>

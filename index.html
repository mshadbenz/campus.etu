<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campus Étudiant — Your Trusted Partner for Studying Abroad</title>
<meta name="description" content="Campus Étudiant guides students through university admissions, student visa procedures and study-abroad applications in France, Italy, Spain, Poland and Portugal.">
<meta property="og:title" content="Campus Étudiant"><meta property="og:description" content="Your Trusted Partner for Studying Abroad.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap">
<style>
:root{--navy:#12293A;--navy2:#1A3A50;--blue:#0B86A3;--teal:#22AECB;--lblue:#E6F6FA;--bg:#F4FAFC;--text:#14283A;--mute:#587080;--line:#DDEBF0;--r:18px;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:90px}*,*:before,*:after{box-sizing:inherit}
body{margin:0;font:16px/1.65 'Plus Jakarta Sans',system-ui,'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;color:var(--text);background:#fff;overflow-x:hidden}
img,svg{max-width:100%}a{color:inherit;text-decoration:none}h1,h2,h3{line-height:1.12;margin:0 0 .5em;letter-spacing:-.02em;color:var(--navy)}
h1{font-size:clamp(2.3rem,6vw,4.2rem);font-weight:800}h2{font-size:clamp(1.7rem,3.6vw,2.6rem);font-weight:800}h3{font-size:1.15rem}p{margin:0 0 1em}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:6px}
.wrap{max-width:1180px;margin:auto;padding:0 22px}section{padding:84px 0}.alt{background:var(--bg)}.dark{background:var(--navy);color:#fff}.dark h2,.dark h3{color:#fff}.dark p{color:#BFD3DC}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);margin-bottom:12px;display:block}.lead{font-size:1.15rem;color:var(--mute);max-width:640px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 26px;border-radius:999px;font-weight:700;border:1.5px solid transparent;cursor:pointer;font:inherit;font-weight:700;transition:transform .15s,box-shadow .15s,background .15s}
.btn:hover{transform:translateY(-2px)}.btn-p{background:var(--blue);color:#fff;box-shadow:0 8px 22px rgba(11,134,163,.28)}.btn-s{background:#fff;border-color:var(--line);color:var(--navy)}.btn-w{background:#fff;color:var(--navy)}.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.7);backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:.25s}header.sc{background:#fff;border-color:var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:72px}.logo{font-weight:800;font-size:1.25rem;color:var(--navy);display:flex;gap:10px;align-items:center}.logo img{height:46px;width:auto;display:block}.logo i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--teal));display:grid;place-items:center;color:#fff;font-style:normal;font-size:1rem}
.links{display:flex;gap:26px;align-items:center}.links a{font-weight:500;font-size:.95rem;color:var(--mute)}.links a:hover,.links a.on{color:var(--navy)}.links a.btn{color:#fff;padding:10px 20px}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:10px;width:44px;height:44px;font-size:1.3rem;cursor:pointer}
@media(max-width:900px){.burger{display:block}.links{display:none;position:absolute;top:72px;left:0;right:0;background:#fff;flex-direction:column;align-items:stretch;padding:18px 22px 26px;border-bottom:1px solid var(--line);gap:4px}.links.open{display:flex}.links a{padding:12px 0}.links a.btn{justify-content:center}}
.hero{padding:60px 0 80px;background:radial-gradient(900px 400px at 85% 0,#D6F1F7,transparent),#fff}.hero .g{display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center}
@media(max-width:900px){.hero .g{grid-template-columns:1fr}}.cta{display:flex;flex-wrap:wrap;gap:12px;margin:26px 0}.note{font-size:.9rem;color:var(--mute);border-left:3px solid var(--blue);padding-left:14px;max-width:520px}
.art{position:relative;border-radius:28px;overflow:hidden;aspect-ratio:4/4.4;background:linear-gradient(160deg,#0F6F88,var(--navy));box-shadow:0 30px 60px rgba(18,41,58,.25)}.art svg{width:100%;height:100%;display:block}
.float{position:absolute;background:#fff;border-radius:14px;padding:12px 16px;font-weight:700;font-size:.85rem;color:var(--navy);box-shadow:0 12px 30px rgba(18,41,58,.18);display:flex;gap:10px;align-items:center}.float b{width:30px;height:30px;border-radius:9px;background:var(--lblue);color:var(--blue);display:grid;place-items:center}
.grid{display:grid;gap:22px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
@media(max-width:1000px){.g5,.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:var(--r);padding:26px;background:#fff;transition:.2s}.card:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(18,41,58,.08)}
.ic,.float b,.art,.tag,h1,h2,h3,span,p,li{font-family:'Plus Jakarta Sans',system-ui,'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}.ic{width:46px;height:46px;border-radius:13px;background:var(--lblue);color:var(--blue);display:grid;place-items:center;font-size:1.25rem;margin-bottom:16px}
.dest{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:3/4.15;color:#fff;background:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.6px) 0 0/20px 20px,linear-gradient(180deg,#1A3E57 0%,#0F2535 100%);border:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;justify-content:flex-end;padding:22px;transition:.25s}.dest:hover{transform:translateY(-6px)}.dest svg{position:absolute;inset:0;width:100%;height:100%}.dest:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(8,22,32,.85))}.dest>*:not(svg){position:relative;z-index:1}.dest h3{color:#fff;margin:0 0 4px;font-size:1.3rem}.dest p{font-size:.86rem;color:#DCEBF0;margin:0 0 10px}.dest span{font-weight:700;font-size:.85rem}.dest .map{position:absolute;inset:auto;top:12px;left:50%;width:80%;max-width:300px;height:auto;aspect-ratio:1;z-index:1;transform:translateX(-50%);transition:transform .35s;filter:drop-shadow(0 8px 16px rgba(0,0,0,.28))}.dest.np:before{content:"";position:absolute;inset:0;background:radial-gradient(65% 50% at 50% 30%,rgba(34,174,203,.38),transparent 72%)}.dest:after{background:linear-gradient(transparent 55%,rgba(8,22,32,.8))!important}.map .flag{opacity:0;transition:opacity .35s}.dest:hover .map,.dest:focus-visible .map{transform:translateX(-50%) scale(1.07)}.dest:hover .map .flag,.dest:focus-visible .map .flag{opacity:1}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:18px;counter-reset:s}.step{position:relative;padding-top:54px}.step:before{content:attr(data-n);position:absolute;top:0;left:0;width:42px;height:42px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800}.step:after{content:"";position:absolute;top:21px;left:52px;right:-8px;height:2px;background:var(--line)}.step:last-child:after{display:none}
@media(max-width:900px){.steps{grid-template-columns:1fr}.step{padding:0 0 28px 62px}.step:after{top:46px;left:20px;right:auto;width:2px;height:calc(100% - 46px)}}
.split{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}@media(max-width:900px){.split{grid-template-columns:1fr;gap:30px}}
.ticks{list-style:none;padding:0;margin:0}.ticks li{padding:10px 0 10px 32px;position:relative;border-bottom:1px solid var(--line)}.ticks li:before{content:"✓";position:absolute;left:0;color:var(--blue);font-weight:800}.dark .ticks li{border-color:#2A4A5E}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--lblue);color:var(--blue);margin-right:6px}.sample{border:1px dashed var(--blue);background:var(--lblue);color:var(--navy);border-radius:12px;padding:12px 16px;font-size:.9rem;margin-bottom:22px}
.phero{padding:70px 0 50px;background:linear-gradient(180deg,var(--lblue),#fff)}
details{border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:10px;background:#fff}summary{cursor:pointer;font-weight:700;color:var(--navy)}details p{margin:10px 0 0;color:var(--mute)}
label{display:block;font-weight:600;font-size:.9rem;margin:0 0 6px}.f{margin-bottom:18px}input,select,textarea{width:100%;font:inherit;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--text)}input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:3px solid rgba(11,134,163,.18)}
.err{color:#C0262D;font-size:.82rem;margin-top:5px;min-height:0}input[aria-invalid=true],select[aria-invalid=true],textarea[aria-invalid=true]{border-color:#C0262D}
.form{max-width:680px;margin:auto;background:#fff;border:1px solid var(--line);border-radius:24px;padding:34px;box-shadow:0 20px 50px rgba(18,41,58,.07)}@media(max-width:620px){.form{padding:22px}}
.prog{display:flex;gap:6px;margin-bottom:26px}.prog i{flex:1;height:6px;border-radius:6px;background:var(--line);transition:.3s}.prog i.d{background:var(--blue)}.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:620px){.row2{grid-template-columns:1fr}}.nv{display:flex;justify-content:space-between;gap:12px;margin-top:10px}
.status{border-radius:14px;padding:16px 18px;margin-top:18px}.warn{background:#FFF7E6;border:1px solid #F5D58A;color:#6B4A00}.ok{background:#E8F7EE;border:1px solid #9AD8B1;color:#14532D}.bad{background:#FDECEC;border:1px solid #F3AEB0;color:#7A1A1F}
.rev dt{font-size:.78rem;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;margin-top:12px}.rev dd{margin:0;font-weight:600}
footer{background:var(--navy);color:#BFD3DC;padding:64px 0 30px}footer h3{color:#fff;font-size:1rem}footer a{display:block;padding:4px 0;color:#BFD3DC}footer a:hover{color:#fff}.fg{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:34px}@media(max-width:800px){.fg{grid-template-columns:1fr 1fr}}@media(max-width:520px){.fg{grid-template-columns:1fr}}
.copy{border-top:1px solid #2A4A5E;margin-top:36px;padding-top:20px;font-size:.85rem}.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px}.bar input{max-width:320px}.chip{border:1px solid var(--line);background:#fff;padding:9px 16px;border-radius:99px;cursor:pointer;font:inherit;font-weight:600;font-size:.88rem}.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.fade{animation:in .45s ease both}@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.skip{position:absolute;left:-999px}.skip:focus{left:10px;top:10px;background:#fff;padding:10px;z-index:99}
</style>

/* ===== Validation ===== */
const emailRe=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/,phoneRe=/^\+?[0-9\s().-]{8,18}$/;
function validate(form,names){let ok=true,first=null;names.forEach(n=>{const el=form.elements[n];if(!el)return;let m="";const v=(el.type==="checkbox"?el.checked:el.value.trim());
 if(el.required&&!v)m=el.type==="checkbox"?"This consent is required.":"This field is required.";
 else if(v&&el.type==="email"&&!emailRe.test(v))m="Enter a valid email address.";
 else if(v&&el.dataset.phone&&!phoneRe.test(v))m="Enter a valid phone number.";
 else if(v&&el.dataset.year&&!(+v>=1980&&+v<=2035))m="Enter a valid year.";
 else if(v&&el.type==="date"&&new Date(v)>new Date())m="Date cannot be in the future.";
 const e=$(`[data-e="${n}"]`,form);if(e)e.textContent=m;el.setAttribute("aria-invalid",!!m);if(m){ok=false;first=first||el}});if(first)first.focus();return ok}
async function send(kind,data){if(!CONFIG.formEndpoint)return{ok:false,dev:true};
 try{const r=await fetch(CONFIG.formEndpoint,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({kind,...data})});return{ok:r.ok}}catch(e){return{ok:false}}}
const devMsg=`<div class="status warn"><strong>Development mode — nothing was sent.</strong> No form endpoint is configured. Set <code>CONFIG.formEndpoint</code> to a form service or your own API to enable real submissions.</div>`;
const errMsg=`<div class="status bad"><strong>We couldn't send your request.</strong> Please check your connection and try again.</div>`;

function bindContact(){const f=$("#cf");if(!f)return;let busy=false;f.addEventListener("submit",async e=>{e.preventDefault();if(busy||!validate(f,["name","email","msg","consent"]))return;busy=true;const b=$("button",f);b.disabled=true;b.textContent="Sending…";
 const r=await send("contact",{name:f.name.value,email:f.email.value,message:f.msg.value});busy=false;b.disabled=false;b.textContent="Send Message";
 $("#cs").innerHTML=r.ok?`<div class="status ok"><strong>Message sent.</strong> Thank you — we'll get back to you.</div>`:r.dev?devMsg:errMsg;if(r.ok)f.reset()})}

/* ===== Application (5 steps + review) ===== */
const STEPS=[
 {t:"Personal information",n:["fullName","dob","nationality","residence","phone","email"],h:()=>fld("fullName","Full name","text",1)+`<div class="row2">${fld("dob","Date of birth","date",1)}${fld("nationality","Nationality","text",1)}</div>`+fld("residence","Country of residence","text",1)+`<div class="row2">${fld("phone","Phone number","tel",1,'data-phone="1"')}${fld("whatsapp","WhatsApp (if different)","tel",0,'data-phone="1"')}</div>`+fld("email","Email address","email",1)},
 {t:"Academic background",n:["qualification","field","institution","gradYear"],h:()=>sel("qualification","Highest qualification",["Baccalauréat / High school","Bachelor's / Licence","Master's","Other"])+fld("field","Field of study","text",1)+fld("institution","Institution","text",1)+`<div class="row2">${fld("gradYear","Graduation year","text",1,'data-year="1" inputmode="numeric"')}${fld("results","Academic results (optional)","text",0)}</div>`},
 {t:"Study preferences",n:["destination","degree","intended","intake","instrLang"],h:()=>sel("destination","Preferred destination",[...DEST.map(d=>d.n),"Other / Undecided"])+sel("degree","Desired degree",["Bachelor's","Master's","PhD","Other"])+fld("intended","Intended field of study","text",1)+`<div class="row2">${sel("intake","Preferred intake",["Autumn","Spring","Flexible"])}${sel("instrLang","Language of instruction",["French","English","Italian","Spanish","Polish","Portuguese","No preference"])}</div>`},
 {t:"Language skills",n:[],h:()=>["French","English","Italian","Spanish"].map(l=>sel("lang"+l,l+" level",["None","Beginner","Intermediate","Advanced","Native"],0)).join('')+fld("otherLang","Other languages","text",0)+fld("certs","Certificates, if available (e.g. DELF, TCF, IELTS)","text",0)},
 {t:"Review and consent",n:["consent"],h:()=>`<dl class="rev" id="rv"></dl><div class="f" style="margin-top:22px"><label style="font-weight:500"><input type="checkbox" name="consent" style="width:auto;margin-right:8px" required>I consent to Campus Étudiant using the information above to contact me about my application. I have read the <a href="#/privacy" style="color:var(--blue)" target="_blank">privacy policy</a>. *</label><div class="err" data-e="consent" role="alert"></div></div><p style="font-size:.85rem;color:var(--mute)">No identity documents or files are collected in this form, to avoid collecting unnecessary personal data.</p>`}
];
function bindApply(){const root=$("#ap");if(!root)return;let i=0,done=false,busy=false;const store={};const pre=new URLSearchParams(location.hash.split("?")[1]||"").get("d");
 function draw(){root.innerHTML=`<div class="prog" role="progressbar" aria-valuemin="1" aria-valuemax="${STEPS.length}" aria-valuenow="${i+1}" aria-label="Application progress">${STEPS.map((_,k)=>`<i class="${k<=i?'d':''}"></i>`).join('')}</div><p style="color:var(--mute);font-size:.9rem;margin:0 0 4px">Step ${i+1} of ${STEPS.length}</p><h2 style="font-size:1.5rem" tabindex="-1" id="sh">${STEPS[i].t}</h2><form id="sf" novalidate class="fade">${STEPS[i].h()}<div class="nv">${i?'<button type="button" class="btn btn-s" id="bk">← Back</button>':'<span></span>'}<button class="btn btn-p" type="submit">${i===STEPS.length-1?'Submit Application':'Continue →'}</button></div><div id="as" role="status" aria-live="polite"></div></form>`;
  const f=$("#sf");[...f.elements].forEach(el=>{if(el.name&&store[el.name]!==undefined){el.type==="checkbox"?el.checked=store[el.name]:el.value=store[el.name]}});
  if(i===2&&pre&&!store.destination){const d=DEST.find(x=>x.id===pre);if(d)f.destination.value=d.n}
  if(i===STEPS.length-1){const L={fullName:"Full name",dob:"Date of birth",nationality:"Nationality",residence:"Residence",phone:"Phone",whatsapp:"WhatsApp",email:"Email",qualification:"Qualification",field:"Field",institution:"Institution",gradYear:"Graduation year",results:"Results",destination:"Destination",degree:"Degree",intended:"Intended field",intake:"Intake",instrLang:"Instruction language",otherLang:"Other languages",certs:"Certificates"};$("#rv").innerHTML=Object.keys(L).filter(k=>store[k]).map(k=>`<dt>${L[k]}</dt><dd>${esc(store[k])}</dd>`).join('')+["French","English","Italian","Spanish"].filter(l=>store["lang"+l]).map(l=>`<dt>${l}</dt><dd>${esc(store["lang"+l])}</dd>`).join('')}
  const save=()=>[...f.elements].forEach(el=>{if(el.name)store[el.name]=el.type==="checkbox"?el.checked:el.value.trim()});
  $("#bk")&&$("#bk").addEventListener("click",()=>{save();i--;draw();$("#sh").focus()});
  f.addEventListener("submit",async e=>{e.preventDefault();if(!validate(f,STEPS[i].n))return;save();
   if(i<STEPS.length-1){i++;draw();$("#sh").focus();return}
   if(busy)return;busy=true;const b=$(".btn-p",f);b.disabled=true;b.textContent="Submitting…";const r=await send("application",store);busy=false;
   if(r.ok){root.innerHTML=`<div class="status ok" role="status"><h2 style="font-size:1.4rem">Application received</h2><p>Thank you, ${esc(store.fullName)}. We'll contact you using the details you provided.</p></div>`;return}
   b.disabled=false;b.textContent="Submit Application";$("#as").innerHTML=r.dev?devMsg:errMsg})}
 draw()}

/* ===== Blog filtering ===== */
function bindBlog(){const pl=$("#pl");if(!pl)return;let cat="All",q="";const draw=()=>{const l=POSTS.filter(p=>(cat==="All"||p.cat===cat)&&(p.t+p.ex+p.tag).toLowerCase().includes(q));pl.innerHTML=l.length?l.map(p=>`<a class="card" href="#/blog/${p.id}"><span class="tag">${p.tag}</span><span style="font-size:.8rem;color:var(--mute)">${p.min} min read</span><h3 style="margin-top:12px">${p.t}</h3><p style="color:var(--mute);margin:0">${p.ex}</p></a>`).join(''):`<p style="grid-column:1/-1;color:var(--mute)">No articles match your search.</p>`};draw();
 $("#q").addEventListener("input",e=>{q=e.target.value.toLowerCase();draw()});$$("#cats .chip").forEach(c=>c.addEventListener("click",()=>{cat=c.dataset.c;$$("#cats .chip").forEach(x=>{x.classList.toggle("on",x===c);x.setAttribute("aria-pressed",x===c)});draw()}))}

/* ===== Shell ===== */
function shell(){$("#lg").src=LOGO;$("#lk").innerHTML=NAV.map(n=>`<a href="#${n[1]}" data-p="${n[1]}">${n[0]}</a>`).join('')+`<a class="btn btn-p" href="#/apply">Start Your Journey</a>`;
 const s=Object.entries(CONFIG.social).filter(x=>x[1]).map(x=>`<a href="${esc(x[1])}" target="_blank" rel="noopener">${x[0]}</a>`).join('')||`<span style="font-size:.85rem">Social links: set CONFIG.social</span>`;
 $("#ft").innerHTML=`<div><div style="background:#fff;border-radius:14px;padding:10px 16px;display:inline-block"><img src="${LOGO}" alt="Campus Étudiant" width="640" height="185" style="height:46px;width:auto;display:block"></div><p style="margin-top:14px;max-width:320px">Your Trusted Partner for Studying Abroad. Guidance for admissions, student visas and university applications.</p></div><div><h3>Explore</h3>${NAV.slice(0,6).map(n=>`<a href="#${n[1]}">${n[0]}</a>`).join('')}</div><div><h3>Destinations</h3>${DEST.map(d=>`<a href="#/destinations/${d.id}">${d.f} ${d.n}</a>`).join('')}</div><div><h3>Contact</h3>${CONFIG.email?`<a href="mailto:${esc(CONFIG.email)}">${esc(CONFIG.email)}</a>`:''}<a href="#/contact">Contact form</a>${s}<a href="#/privacy">Privacy Policy</a><a href="#/privacy">Terms of Service</a></div>`;
 $("#yr").textContent=new Date().getFullYear()}
function route(){const raw=location.hash.slice(1)||"/";const[path]=raw.split("?");const seg=path.split("/").filter(Boolean);let h,t="Campus Étudiant";
 if(!seg.length||path==="/"){h=PAGES.home()}else if(seg[0]==="destinations"){h=seg[1]?PAGES.dest(seg[1]):PAGES.destinations();t="Destinations"}
 else if(seg[0]==="services"){h=PAGES.services();t="Services"}else if(seg[0]==="about"){h=PAGES.about();t="About Us"}
 else if(seg[0]==="blog"){h=seg[1]?PAGES.post(seg[1]):PAGES.blog();t="Blog"}else if(seg[0]==="contact"){h=PAGES.contact();t="Contact"}
 else if(seg[0]==="privacy"){h=PAGES.privacy();t="Privacy"}
 else if(seg[0]==="apply"){h=phero("Student Application","Start your application","A few short steps. Your answers are kept as you move between steps.")+`<section style="padding-top:20px"><div class="wrap"><div class="form" id="ap"></div></div></section>`;t="Apply"}
 else if(seg[0]==="how"){location.replace("#/");return}else{h=PAGES.nf();t="Not found"}
 const m=$("#main");m.innerHTML=h;document.title=(t==="Campus Étudiant"?t:t+" — Campus Étudiant");
 $$("#lk a[data-p]").forEach(a=>a.classList.toggle("on",a.dataset.p==="/"+(seg[0]||"")));$("#lk").classList.remove("open");$("#bg").setAttribute("aria-expanded","false");
 bindContact();bindApply();bindBlog();
 if(raw.startsWith("/#how")||raw==="how"){}else window.scrollTo(0,0);m.focus({preventScroll:true})}
document.addEventListener("click",e=>{const a=e.target.closest('a[href="#/#how"]');if(a){e.preventDefault();if(location.hash&&location.hash!=="#/")location.hash="#/";setTimeout(()=>{const h=$("#how");h&&h.scrollIntoView({behavior:"smooth"})},50)}});
$("#bg").addEventListener("click",()=>{const o=$("#lk").classList.toggle("open");$("#bg").setAttribute("aria-expanded",o)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("#lk").classList.remove("open");$("#bg").setAttribute("aria-expanded","false")}});
window.addEventListener("scroll",()=>$("#hd").classList.toggle("sc",scrollY>8),{passive:true});
window.addEventListener("hashchange",route);shell();route();
</script>
</body>
</html>
